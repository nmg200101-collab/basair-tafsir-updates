name: P86 synthetic Android lab ONLY
on:
  push:
    branches:
      - p86-lab-isolated
    paths:
      - 'p86-lab/**'
      - '.github/workflows/build-p86-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p86-synthetic-lab-isolated
  cancel-in-progress: false

jobs:
  build-synthetic-apk:
    if: github.ref == 'refs/heads/p86-lab-isolated'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android build platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate that only synthetic P86 lab is built
        run: |
          test -f p86-lab/src/main/java/p86/lab/DualContextLabActivity.java
          test -f p86-lab/src/main/AndroidManifest.xml
          grep -q 'p86.lab.isolated.synthetic' p86-lab/build.gradle
          ! grep -r -i 'BasairApp\|BasairVoice\|BasairSpeech\|owner-signing' p86-lab/src/main
      - name: Build synthetic Android debug APK only
        run: gradle -p p86-lab --no-daemon --stacktrace assembleDebug
      - name: Publish lab debug artifact (never a Basair update)
        uses: actions/upload-artifact@v4
        with:
          name: P86-SYNTHETIC-DEBUG-APK-NOT-BASAIR
          path: p86-lab/build/outputs/apk/debug/*.apk
          if-no-files-found: error
