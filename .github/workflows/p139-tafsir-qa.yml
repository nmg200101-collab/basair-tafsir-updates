name: P139 Tafsir single-wave narrator and toggle QA
on:
  pull_request:
    paths:
      - 'p139/**'
      - 'p121/owner-qa/modules/tafsir/p139-*.js'
      - 'p121/owner-qa/modules/tafsir/p139-*.css'
      - '.github/workflows/p139-tafsir-qa.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate narrator syntax
        run: node --check p121/owner-qa/modules/tafsir/p139-natiq.js
      - name: Native and browser voice recovery
        run: node p139/tests/test-p139-natiq.cjs
      - name: Real Quran recording and Tafsir order
        run: node p139/tests/test-p139-narrator-integration.cjs
      - name: Automatic next ayah
        run: node p139/tests/test-p139-auto-next.cjs
      - name: One wave narrator and persisted two-way Next switch
        run: node p139/tests/test-p139-wave-toggle.cjs
