name: P148 Temporary Owner QA
on:
  push:
    branches:
      - fix/p148-lesson-cards-note-anchor-20261114
  pull_request:
    branches:
      - main
jobs:
  p148-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source and integrity checks
        run: |
          node --version
          node p148/tests/test-p148-source.cjs
      - name: Chromium visual and interaction regression (Playwright)
        run: |
          google-chrome --version
          npm install --no-save --package-lock=false playwright-core@1.57.0
          node p148/tests/run-p148-playwright.cjs
