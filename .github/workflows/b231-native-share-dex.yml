name: B231 Native Share Dex
on:
  push:
    branches:
      - b231-native-share-build-temp

jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile compatibility shell
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p build/stubsrc/app/basair/quran build/stubclasses build/classes build/dex
          cat > build/stubsrc/app/basair/quran/MainActivity.java <<'STUB'
          package app.basair.quran;
          public class MainActivity extends android.app.Activity {}
          STUB
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d build/stubclasses build/stubsrc/app/basair/quran/MainActivity.java
          jar cf build/mainactivity-stub.jar -C build/stubclasses .
          javac -source 8 -target 8 -cp "$ANDROID_JAR:build/mainactivity-stub.jar" -d build/classes ci/b231/Rc1Activity.java
          find build/classes/app/basair/quran -name 'Rc1Activity*.class' -print0 | xargs -0 "$BT/d8" --min-api 23 --lib "$ANDROID_JAR" --classpath build/mainactivity-stub.jar --output build/dex
          test -s build/dex/classes.dex
          sha256sum build/dex/classes.dex | tee build/classes2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: B231-classes2
          path: |
            build/dex/classes.dex
            build/classes2.sha256
          if-no-files-found: error
