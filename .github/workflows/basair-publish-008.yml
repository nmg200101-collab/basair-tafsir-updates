name: BASAIR publish surah 008

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[basair-publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: QA, build canonical file, hashes, manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, re, unicodedata, difflib, os, sys
          from pathlib import Path

          SURAH=8
          NAME='الأنفال'
          VER='001'
          TOTAL=75
          base=Path(f'surah-{SURAH:03d}/{VER}')
          expected=[(1,25),(26,50),(51,75)]
          part_rows=[]
          all_ayahs=[]
          required=('meaning','bayan','tadabbur','summary')

          def sha256_bytes(b): return hashlib.sha256(b).hexdigest()
          def norm(s):
              s=unicodedata.normalize('NFKC',s)
              s=re.sub(r'[\u064b-\u065f\u0670]','',s)
              s=re.sub(r'[^\w\u0600-\u06FF]+',' ',s)
              return re.sub(r'\s+',' ',s).strip().lower()

          for a,b in expected:
              p=base/f'part-{a:03d}-{b:03d}.json'
              raw=p.read_bytes()
              try: d=json.loads(raw.decode('utf-8'))
              except Exception as e: raise SystemExit(f'JSON_FAIL {p}: {e}')
              assert d.get('schema')=='basair-tafsir-part-v1', (p,'schema')
              assert d.get('surah')==SURAH and d.get('name')==NAME and d.get('content_version')==VER
              assert d.get('from')==a and d.get('to')==b and d.get('ayah_count')==b-a+1
              ay=d.get('ayahs')
              assert isinstance(ay,list) and len(ay)==b-a+1
              assert [x.get('ayah') for x in ay]==list(range(a,b+1))
              for x in ay:
                  for k in required:
                      assert isinstance(x.get(k),str) and x[k].strip(), (x.get('ayah'),k)
                  if 'knowledge' in x:
                      assert isinstance(x['knowledge'],str) and x['knowledge'].strip(), (x.get('ayah'),'knowledge')
                  extra=set(x)-({'ayah'}|set(required)|{'knowledge'})
                  assert not extra, (x.get('ayah'),'extra',extra)
              part_rows.append({'from':a,'to':b,'file':str(p),'sha256':sha256_bytes(raw),'bytes':len(raw)})
              all_ayahs.extend(ay)

          assert len(all_ayahs)==TOTAL and [x['ayah'] for x in all_ayahs]==list(range(1,TOTAL+1))

          # Exact and near-literal duplication checks inside each editorial field.
          dup_errors=[]
          for field in ('meaning','bayan','tadabbur','summary','knowledge'):
              vals=[]
              for x in all_ayahs:
                  if field in x:
                      vals.append((x['ayah'],norm(x[field]),x[field]))
              seen={}
              for n,s,orig in vals:
                  if s in seen:
                      dup_errors.append(f'EXACT {field}: {seen[s]} / {n}')
                  else: seen[s]=n
              for i in range(len(vals)):
                  ai,si,_=vals[i]
                  if len(si)<35: continue
                  for j in range(i+1,len(vals)):
                      aj,sj,_=vals[j]
                      if len(sj)<35: continue
                      r=difflib.SequenceMatcher(None,si,sj).ratio()
                      if r>=0.93:
                          dup_errors.append(f'NEAR {field}: {ai}/{aj} ratio={r:.3f}')
          if dup_errors:
              print('\n'.join(dup_errors))
              raise SystemExit('DUPLICATION_QA_FAIL')

          # Targeted sensitive-verse structural checks: require explanatory context where most needed.
          sensitive=[1,9,12,15,16,17,24,25,30,33,34,35,38,39,41,42,48,50,53,55,57,58,60,61,62,65,66,67,68,69,70,71,72,73,75]
          by={x['ayah']:x for x in all_ayahs}
          for n in sensitive:
              x=by[n]
              assert len(x['meaning'])>=35 and len(x['bayan'])>=35 and len(x['summary'])>=20, ('SENSITIVE_TOO_SHORT',n)

          canonical={
              'schema':'basair-tafsir-content-v1','surah':SURAH,'name':NAME,
              'content_version':VER,'ayah_count':TOTAL,'ayahs':all_ayahs
          }
          cpath=Path(f'basair-surah-{SURAH:03d}-{VER}.json')
          cbytes=json.dumps(canonical,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          cpath.write_bytes(cbytes)
          csha=sha256_bytes(cbytes)

          mpath=Path('basair-tafsir-manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          assert m.get('schema')=='basair-tafsir-update-v2'
          assert isinstance(m.get('surahs'),dict)
          previous=set(m['surahs'])
          m['surahs'][str(SURAH)]={
              'name':NAME,'content_version':VER,'ayah_count':TOTAL,
              'parts':part_rows,'canonical_sha256':csha
          }
          assert previous.issubset(set(m['surahs']))
          mpath.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          json.loads(mpath.read_text(encoding='utf-8'))

          print('QA=PASS')
          print(f'SURAH={SURAH} NAME={NAME} AYAH_COUNT={TOTAL} PARTS={len(part_rows)} VERSION={VER}')
          for r in part_rows: print(f"PART {r['from']:03d}-{r['to']:03d} bytes={r['bytes']} sha256={r['sha256']}")
          print(f'CANONICAL bytes={len(cbytes)} sha256={csha}')
          PY
      - name: Commit publication
        shell: bash
        run: |
          git config user.name 'basair-auto-publish'
          git config user.email 'actions@users.noreply.github.com'
          git add basair-surah-008-001.json basair-tafsir-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m '[basair-publish] Publish surah 008 after QA'
          git push
