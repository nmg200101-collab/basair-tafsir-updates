name: p155-native-tafsir-browser-qa
on:
  pull_request:
    paths:
      - 'p155/**'
      - 'p121/owner-qa/modules/tafsir/p155-*'
      - '.github/workflows/p155-native-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p155-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run 125-percent-scale native Tafsir UI integration
        run: python p155/tests/test-p155-browser.py
