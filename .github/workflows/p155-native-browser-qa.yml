name: p155-native-tafsir-browser-qa
on:
  pull_request:
    paths:
      - 'p155/**'
      - 'p121/owner-qa/modules/tafsir/p155-*'
      - '.github/workflows/p155-native-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p155-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Python driver (browser binary is preinstalled)
        run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Real Chromium mobile viewport / 125% integration
        run: python p155/tests/test-p155-browser.py
