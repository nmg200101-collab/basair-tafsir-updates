name: P143 compact Tafsir microphone and note + local phonetics QA
on:
  pull_request:
    paths:
      - 'p143/**'
      - 'p121/owner-qa/modules/tafsir/p143-*.js'
      - 'p121/owner-qa/modules/tafsir/p143-*.css'
      - '.github/workflows/p143-tafsir-qa.yml'
permissions:
  contents: read
jobs:
  p143:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check p121/owner-qa/modules/tafsir/p143-natiq.js
      - name: Native voice regression
        run: node p143/tests/test-p143-natiq.cjs
      - name: Original Quran recitation and Tafsir order
        run: node p143/tests/test-p143-narrator-integration.cjs
      - name: Next ayah continuation
        run: node p143/tests/test-p143-auto-next.cjs
      - name: Mic-note unified controls and original V695 deduplication
        run: node p143/tests/test-p143-mic-note-controls.cjs
      - name: Conservative Arabic phrase guide and voice fallback
        run: node p143/tests/test-p143-voice-recovery-and-diction.cjs
      - name: Chromium 125-percent font scale layout acceptance
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files \
            --dump-dom "file://$PWD/p143/tests/p143-compact-mic-note-layout.html" 2>/dev/null | grep -F '"pass":true'
