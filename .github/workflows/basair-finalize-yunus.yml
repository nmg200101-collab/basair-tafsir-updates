name: Basair finalize Yunus

on:
  push:
    paths:
      - '.github/workflows/basair-finalize-yunus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final QA, canonical assembly, hashes and manifest publish
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib, difflib, re, subprocess, sys, datetime

          ROOT = pathlib.Path('.')
          SURAH = 10
          NAME = 'يونس'
          AYAH_COUNT = 109
          VER = '001'
          part_paths = [
              pathlib.Path('surah-010/001/part-001-025.json'),
              pathlib.Path('surah-010/001/part-026-050.json'),
              pathlib.Path('surah-010/001/part-051-075.json'),
              pathlib.Path('surah-010/001/part-076-100.json'),
              pathlib.Path('surah-010/001/part-101-109.json'),
          ]

          all_ayahs=[]
          parts_meta=[]
          expected=1
          required=('ayah','meaning','bayan','tadabbur','summary')

          def norm(s):
              s = re.sub(r'[\W_]+',' ',str(s),flags=re.UNICODE)
              return ' '.join(s.split()).strip()

          field_values={k:[] for k in ('bayan','tadabbur','summary')}
          for p in part_paths:
              if not p.exists():
                  raise SystemExit(f'Missing part: {p}')
              raw=p.read_bytes()
              data=json.loads(raw.decode('utf-8'))
              if data.get('surah') != SURAH or data.get('name') != NAME or data.get('content_version') != VER:
                  raise SystemExit(f'Bad part identity: {p}')
              ayahs=data.get('ayahs') or []
              if not ayahs:
                  raise SystemExit(f'Empty part: {p}')
              if data.get('from') != expected:
                  raise SystemExit(f'Gap/order error before {p}: expected {expected}, got {data.get("from")}')
              if data.get('to') != ayahs[-1].get('ayah') or data.get('from') != ayahs[0].get('ayah'):
                  raise SystemExit(f'Part range mismatch: {p}')
              if data.get('ayah_count') != len(ayahs):
                  raise SystemExit(f'Part ayah_count mismatch: {p}')
              for a in ayahs:
                  if a.get('ayah') != expected:
                      raise SystemExit(f'Ayah sequence error: expected {expected}, got {a.get("ayah")}')
                  for k in required:
                      if k not in a or (k != 'ayah' and not str(a[k]).strip()):
                          raise SystemExit(f'Missing/empty {k} at ayah {expected}')
                  for k in field_values:
                      field_values[k].append((expected,norm(a[k])))
                  if 'knowledge' in a and not str(a['knowledge']).strip():
                      raise SystemExit(f'Empty optional knowledge at ayah {expected}')
                  all_ayahs.append(a)
                  expected += 1
              parts_meta.append({
                  'from': data['from'],
                  'to': data['to'],
                  'file': str(p).replace('\\','/'),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
              })

          if expected != AYAH_COUNT + 1 or len(all_ayahs) != AYAH_COUNT:
              raise SystemExit(f'Final count mismatch: {len(all_ayahs)}')

          # Exact duplicate QA in core editorial fields.
          for field, vals in field_values.items():
              seen={}
              for ay, v in vals:
                  if v in seen:
                      raise SystemExit(f'Exact duplicate {field}: ayahs {seen[v]} and {ay}')
                  seen[v]=ay

          # Conservative near-duplicate QA: only flag very high similarity on substantial strings.
          for field, vals in field_values.items():
              for i in range(len(vals)):
                  ai, vi = vals[i]
                  if len(vi) < 45: continue
                  for j in range(i+1, len(vals)):
                      aj, vj = vals[j]
                      if len(vj) < 45: continue
                      r=difflib.SequenceMatcher(None,vi,vj).ratio()
                      if r >= 0.965:
                          raise SystemExit(f'Near duplicate {field}: ayahs {ai},{aj}, ratio={r:.3f}')

          canonical={
              'schema':'basair-tafsir-surah-v1',
              'surah':SURAH,
              'name':NAME,
              'content_version':VER,
              'ayah_count':AYAH_COUNT,
              'ayahs':all_ayahs,
          }
          canonical_bytes=json.dumps(canonical,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          canonical_path=pathlib.Path('surah-010/001/basair-surah-010-001.json')
          canonical_path.write_bytes(canonical_bytes)
          canonical_sha=hashlib.sha256(canonical_bytes).hexdigest()

          manifest_path=pathlib.Path('basair-tafsir-manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schema') != 'basair-tafsir-update-v2':
              raise SystemExit('Unexpected manifest schema')
          surahs=manifest.setdefault('surahs',{})
          # JSON keys may be strings; preserve every existing entry.
          surahs[str(SURAH)]={
              'name':NAME,
              'content_version':VER,
              'ayah_count':AYAH_COUNT,
              'parts':parts_meta,
              'canonical_sha256':canonical_sha,
          }
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          progress_path=pathlib.Path('basair-tafsir-progress.json')
          progress={
              'current_surah':SURAH,
              'surah_name':NAME,
              'status':'published',
              'completed_to':AYAH_COUNT,
              'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'content_version':VER,
              'staged_to':AYAH_COUNT,
              'publish_stage':'manifest-published-verified'
          }
          progress_path.write_text(json.dumps(progress,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # Verify written files by re-reading before commit.
          json.loads(canonical_path.read_text(encoding='utf-8'))
          m2=json.loads(manifest_path.read_text(encoding='utf-8'))
          e=m2['surahs'].get(str(SURAH))
          if not e or e.get('ayah_count') != AYAH_COUNT or e.get('canonical_sha256') != canonical_sha:
              raise SystemExit('Manifest verification failed before commit')
          print('YUNUS_QA_PASS')
          print('CANONICAL_SHA256='+canonical_sha)
          for pm in parts_meta:
              print(pm)
          PY

          git config user.name "basair-publisher-bot"
          git config user.email "basair-publisher-bot@users.noreply.github.com"
          git add surah-010/001/basair-surah-010-001.json basair-tafsir-manifest.json basair-tafsir-progress.json
          git commit -m "Publish Surah Yunus 10 after final QA"
          git push
