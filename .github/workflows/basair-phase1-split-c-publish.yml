name: Basair Phase1 Split C Publish

on:
  push:
    paths:
      - 'surah-021/**'
      - 'surah-022/**'
      - 'surah-023/**'
      - '.github/workflows/basair-phase1-split-c-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish completed Split C surahs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "basair-auto-publisher"
          git config user.email "basair-auto-publisher@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/basair_phase1_split_c_publish.py
            if git diff --quiet; then
              exit 0
            fi
            git add basair-tafsir-manifest.json
            for f in basair-surah-021-001.json basair-surah-022-001.json basair-surah-023-001.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "[phase1-split-c] Publish completed surah(s) 021-023"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
