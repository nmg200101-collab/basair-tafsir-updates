name: P144 Tafsir compact controls and contextual Arabic TTS QA
on:
  pull_request:
    paths:
      - 'p144/**'
      - 'p121/owner-qa/modules/tafsir/p144-*.js'
      - 'p121/owner-qa/modules/tafsir/p144-*.css'
      - '.github/workflows/p144-tafsir-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Narrator JavaScript syntax
        run: node --check p121/owner-qa/modules/tafsir/p144-natiq.js
      - name: Native Android voice fallback regression
        run: node p144/tests/test-p144-natiq.cjs
      - name: Recorded Quran audio and Tafsir sequence
        run: node p144/tests/test-p144-narrator-integration.cjs
      - name: Automatic next ayah continuation
        run: node p144/tests/test-p144-auto-next.cjs
      - name: Compact mic and note, legacy narrator and controls
        run: node p144/tests/test-p144-mic-note-controls.cjs
      - name: Contextual Arabic phonetics and voice recovery
        run: node p144/tests/test-p144-voice-recovery-and-diction.cjs
      - name: Chromium compact controls and framed status at 125 percent
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files \
            --dump-dom "file://$PWD/p144/tests/p144-compact-status-layout.html" 2>/dev/null | grep -F '"pass":true'
