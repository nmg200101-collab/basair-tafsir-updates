name: Publish staged Surah 65

on:
  push:
    paths:
      - '.github/workflows/publish-surah-065.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate, hash, and publish Surah 65
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          MANIFEST=ROOT/'basair-tafsir-manifest.json'
          def compact(obj): return json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def h(b): return hashlib.sha256(b).hexdigest()
          d=ROOT/'surah-065'/'001'
          files=sorted(d.glob('part-*.json'))
          if not files: raise SystemExit('No files for surah 65')
          all_ayahs=[]; parts=[]; expected=1; name=None
          for p in files:
              b=p.read_bytes(); obj=json.loads(b.decode('utf-8'))
              if obj['surah']!=65: raise SystemExit(f'Wrong surah in {p}')
              if obj['from']!=expected: raise SystemExit(f'Gap/order error in {p}: expected {expected}, got {obj["from"]}')
              if obj['to']-obj['from']+1!=obj['ayah_count']: raise SystemExit(f'Count mismatch in {p}')
              nums=[a['ayah'] for a in obj['ayahs']]
              if nums!=list(range(obj['from'],obj['to']+1)): raise SystemExit(f'Ayah sequence mismatch in {p}')
              for a in obj['ayahs']:
                  for k in ('ayah','meaning','bayan','tadabbur','summary'):
                      if k not in a: raise SystemExit(f'Missing {k} in {p} ayah {a.get("ayah")}')
              name=name or obj['name']; all_ayahs.extend(obj['ayahs'])
              parts.append({'from':obj['from'],'to':obj['to'],'file':p.as_posix(),'sha256':h(b),'bytes':len(b)})
              expected=obj['to']+1
          if len(all_ayahs)!=12: raise SystemExit(f'Surah 65 expected 12 ayahs, found {len(all_ayahs)}')
          manifest=json.loads(MANIFEST.read_text(encoding='utf-8'))
          manifest['surahs']['65']={'name':name,'content_version':'001','ayah_count':12,'parts':parts,'canonical_sha256':h(compact(all_ayahs))}
          MANIFEST.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['65'],ensure_ascii=False))
          PY
            git add basair-tafsir-manifest.json
            if git diff --cached --quiet; then
              echo 'Manifest already up to date'
              exit 0
            fi
            git commit -m 'Publish Basair tafsir Surah At-Talaq 65'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Failed to publish manifest after retries' >&2
          exit 1
