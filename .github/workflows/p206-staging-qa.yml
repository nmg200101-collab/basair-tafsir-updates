name: P206 staging QA temporary
on:
  push:
    branches:
      - fix/p206-follow-lifecycle-six-release-rollback-20261117
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript sources
        run: |
          node --check p206/staging/p206-native-follow-lifecycle.js
          node --check p206/staging/p206-signed-six-rollback.js
          node --check p206/staging/p206-unified-update-notice.js
          node --check p206/tests/p206-node-tests.cjs
          node --check p206/tests/p206-archive-integration.cjs
          node --check p206/tests/p206-pinned-runtime.cjs
      - name: Real P205 signatures and R33 mock
        run: node p206/tests/p206-node-tests.cjs
      - name: Real signed P189-P205 retention and fail-safe checks
        run: node p206/tests/p206-archive-integration.cjs
      - name: Synthetic signed P206 runtime and transactional race
        run: node p206/tests/p206-pinned-runtime.cjs
      - name: Release descriptor audit — original signatures and 41 assets
        run: |
          node --check p206/scripts/prepare-unsigned-p206.cjs
          node p206/scripts/prepare-unsigned-p206.cjs --write
