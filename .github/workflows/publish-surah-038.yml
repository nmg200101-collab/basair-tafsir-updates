name: Publish staged Surah 38

on:
  push:
    paths:
      - '.github/workflows/publish-surah-038.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish Surah 38 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          ranges=[(1,25),(26,50),(51,75),(76,88)]
          expected={
            (1,25):('ec1010852301852b74537021ac5ae380f85f5564f2714ea4017d66d90b2c1bce',14175),
            (26,50):('9bd956bdf5beb1a077df613873be143f565f35f712aa9465aa2b3f917e5f2aea',13570),
            (51,75):('acbc1c1d53a35ef56b8e2a2f8c299a549569e7356eea8b61746c9b4372688371',12052),
            (76,88):('5ce126605ab0c21a4331a9d0039c56c4435f8bc3a30254d74848ca933a89140e',5574),
          }
          h=lambda b: hashlib.sha256(b).hexdigest()
          compact=lambda x: json.dumps(x,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          ayahs=[]; parts=[]
          for a,b in ranges:
              rel=f'surah-038/001/part-{a:03d}-{b:03d}.json'
              p=ROOT/rel
              raw=p.read_bytes()
              sha=h(raw); size=len(raw)
              exp_sha,exp_size=expected[(a,b)]
              if sha!=exp_sha or size!=exp_size: raise SystemExit(f'Fingerprint mismatch: {rel} got {sha}/{size}')
              d=json.loads(raw.decode('utf-8'))
              if d.get('schema')!='basair-tafsir-part-v1' or d.get('surah')!=38 or d.get('name')!='ص' or d.get('content_version')!='001': raise SystemExit(f'Schema/header error: {rel}')
              if d.get('from')!=a or d.get('to')!=b or d.get('ayah_count')!=(b-a+1): raise SystemExit(f'Range/count error: {rel}')
              xs=d.get('ayahs',[])
              if [x.get('ayah') for x in xs] != list(range(a,b+1)): raise SystemExit(f'Ayah sequence error: {rel}')
              for x in xs:
                  for k in ('ayah','meaning','bayan','tadabbur','summary'):
                      if k not in x or (k!='ayah' and (not isinstance(x[k],str) or not x[k].strip())): raise SystemExit(f'Missing {k} at ayah {x.get("ayah")}')
              ayahs.extend(xs)
              parts.append({'from':a,'to':b,'file':rel,'sha256':sha,'bytes':size})
          if [x['ayah'] for x in ayahs] != list(range(1,89)): raise SystemExit('Full ayah sequence error')
          canonical=h(compact(ayahs))
          if canonical!='b7415a7e3843cb632cff603526a189dd044137adbe1acdda300b1cb4346e245f': raise SystemExit(f'Canonical SHA-256 mismatch: {canonical}')
          mp=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('schema')!='basair-tafsir-update-v2' or manifest.get('version')!=2: raise SystemExit('Manifest schema/version error')
          manifest['surahs']['38']={'name':'ص','content_version':'001','ayah_count':88,'parts':parts,'canonical_sha256':canonical}
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['38'],ensure_ascii=False))
          PY
            git add basair-tafsir-manifest.json
            if git diff --cached --quiet; then
              echo 'Surah 38 already published and verified.'
              exit 0
            fi
            git commit -m 'Publish Basair tafsir Surah Sad 38'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying on newest main ($attempt/5)."
            sleep 2
          done
          echo 'Could not publish after concurrency retries.' >&2
          exit 1
