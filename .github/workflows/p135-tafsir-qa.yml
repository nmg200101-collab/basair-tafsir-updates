name: P135 isolated Tafsir reciter and Arabic TTS QA
on:
  pull_request:
    paths:
      - 'p135/**'
      - 'p121/owner-qa/modules/tafsir/p135-*.js'
      - '.github/workflows/p135-tafsir-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p135-simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check p121/owner-qa/modules/tafsir/p135-ayah-catalog.js
          node --check p121/owner-qa/modules/tafsir/p135-reciter-bridge.js
          node --check p121/owner-qa/modules/tafsir/p135-natiq.js
      - name: Verify source and seven reader choices
        run: node p135/tests/test-p135-reciter-bridge.cjs
      - name: Verify narrator Tafsir voice
        run: node p135/tests/test-p135-natiq.cjs
      - name: Verify real-ay ah order and separate playback
        run: node p135/tests/test-p135-narrator-integration.cjs
