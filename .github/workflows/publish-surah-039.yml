name: Publish staged Surah 39

on:
  push:
    paths:
      - '.github/workflows/publish-surah-039.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish Surah 39 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import base64, zlib, json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          payload=''
          ayahs=json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          compact=lambda x: json.dumps(x,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          h=lambda b: hashlib.sha256(b).hexdigest()
          if [x.get('ayah') for x in ayahs] != list(range(1,76)): raise SystemExit('Full ayah sequence error')
          for x in ayahs:
              for k in ('ayah','meaning','bayan','tadabbur','summary'):
                  if k not in x or (k!='ayah' and (not isinstance(x[k],str) or not x[k].strip())): raise SystemExit(f'Missing {k} at ayah {x.get("ayah")}')
          canonical=h(compact(ayahs))
          if canonical!='bf498356c98d3a098a9375baee622b7191fc76e1fa0920b22e42859c7b039b77': raise SystemExit(f'Canonical SHA-256 mismatch: {canonical}')
          mp=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('schema')!='basair-tafsir-update-v2' or manifest.get('version')!=2: raise SystemExit('Manifest schema/version error')
          if '39' in manifest.get('surahs',{}):
              print('Surah 39 already published by another worker; leaving newest manifest unchanged.')
              raise SystemExit(0)
          expected={(1,25):('44af6571b2f08c8163dd0d167e5895ef3b3373dd916346eaa9f04d9a1b263fa8',12584),(26,50):('bdee3c613cd4c8cc673118110303795bd1e69cc666476195bb36d3d49bfbc10d',11261),(51,75):('7ed4c0efcb4cf9f0000f22a918868518e602a8af64c5ca24499bc08759935b10',11200)}
          parts=[]
          for a,b in ((1,25),(26,50),(51,75)):
              xs=[x for x in ayahs if a<=x['ayah']<=b]
              d={'schema':'basair-tafsir-part-v1','surah':39,'name':'الزمر','content_version':'001','from':a,'to':b,'ayah_count':len(xs),'ayahs':xs}
              raw=compact(d); sha=h(raw); size=len(raw)
              if (sha,size)!=expected[(a,b)]: raise SystemExit(f'Fingerprint mismatch part {a}-{b}: {sha}/{size}')
              rel=f'surah-039/001/part-{a:03d}-{b:03d}.json'
              p=ROOT/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(raw)
              chk=json.loads(raw.decode('utf-8'))
              if chk['from']!=a or chk['to']!=b or chk['ayah_count']!=(b-a+1): raise SystemExit(f'Range/count error {rel}')
              if [x['ayah'] for x in chk['ayahs']]!=list(range(a,b+1)): raise SystemExit(f'Ayah sequence error {rel}')
              parts.append({'from':a,'to':b,'file':rel,'sha256':sha,'bytes':size})
          manifest['surahs']['39']={'name':'الزمر','content_version':'001','ayah_count':75,'parts':parts,'canonical_sha256':canonical}
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['39'],ensure_ascii=False))
          PY
            git add surah-039/001 basair-tafsir-manifest.json
            if git diff --cached --quiet; then
              echo 'Surah 39 already published; nothing to commit.'
              exit 0
            fi
            git commit -m 'Publish Basair tafsir Surah Az-Zumar 39'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying on newest main ($attempt/5)."
            sleep 2
          done
          echo 'Could not publish after concurrency retries.' >&2
          exit 1