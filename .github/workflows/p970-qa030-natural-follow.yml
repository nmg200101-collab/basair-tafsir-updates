name: BASAIR QA030 Natural Follow Safety (no publish)
on:
  push:
    branches:
      - fix/p970-qa030-natural-follow-no-freeze-20261108
    paths:
      - 'p92/owner-qa-001/p970-*'
      - 'p92/owner-qa-001/P970-*'
      - '.github/workflows/p970-qa030-natural-follow.yml'
  pull_request:
    paths:
      - 'p92/owner-qa-001/p970-*'
      - 'p92/owner-qa-001/P970-*'
      - '.github/workflows/p970-qa030-natural-follow.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node --check p92/owner-qa-001/p970-audio-follow-visibility-guard.js
      - run: node --check p92/owner-qa-001/P970-QA030-NATURAL-FOLLOW-TEST.mjs
      - run: node p92/owner-qa-001/P970-QA030-NATURAL-FOLLOW-TEST.mjs
      - run: sha256sum p92/owner-qa-001/p970-audio-follow-visibility-guard.js
      - run: wc -c p92/owner-qa-001/p970-audio-follow-visibility-guard.js
      - run: node p92/owner-qa-001/P970-QA030-VERIFY.mjs
      - run: test "$(git show HEAD:p92/owner-qa-001/release.json | wc -c)" -gt 1000
      - run: node p92/owner-qa-001/P970-QA030-STAGING-PACK.mjs
      - name: Archive verified eight-asset candidate
        run: |
          cd p92/owner-qa-001
          zip -q -r QA030-STAGING-EIGHT-ASSETS-NO-PUBLISH.zip QA030-STAGING-ASSETS-NO-PUBLISH
          unzip -t QA030-STAGING-EIGHT-ASSETS-NO-PUBLISH.zip
      - name: Store temporary staging-only artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: basair-qa030-eight-assets-staging-no-publish
          path: p92/owner-qa-001/QA030-STAGING-EIGHT-ASSETS-NO-PUBLISH.zip
          retention-days: 7
          if-no-files-found: error

