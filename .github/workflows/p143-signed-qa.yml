name: P143 signed owner QA Seq20 verification (temporary)
on:
  pull_request:
    paths:
      - 'p143/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p143-signed-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner RSA, all six OTA SHA256 assets and Seq19 rollback
        run: node p143/tests/test-p143-signed-release.cjs
      - name: Rerun Tafsir narration and fixed-phrase regressions
        run: |
          node p143/tests/test-p143-natiq.cjs
          node p143/tests/test-p143-narrator-integration.cjs
          node p143/tests/test-p143-auto-next.cjs
          node p143/tests/test-p143-mic-note-controls.cjs
          node p143/tests/test-p143-voice-recovery-and-diction.cjs
      - name: Chromium visual acceptance at 125-percent font scale
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files \
            --dump-dom "file://$PWD/p143/tests/p143-compact-mic-note-layout.html" 2>/dev/null | grep -F '"pass":true'
