name: P133 free public Android TTS compiler check (no app source)

on:
  push:
    branches:
      - qa/p133-github-runner-smoke-20261111
    paths:
      - '.github/workflows/p133-free-public-android-tts-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-android-tts-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on ubuntu-24.04
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "SDK platforms:"
          ls -la "${ANDROID_HOME}/platforms" || :
          if test ! -f "${ANDROID_HOME}/platforms/android-36/android.jar"; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" || true
          fi
          test -s "${ANDROID_HOME}/platforms/android-36/android.jar"
      - name: Compile anonymous TTS API probe (no Basair app source)
        shell: bash
        run: |
          set -euo pipefail
          cat > TtsApiProbe.java <<'JAVA'
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.Voice;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          class TtsApiProbe {
            boolean safe(WebResourceRequest request, Voice voice) {
              return request.isForMainFrame() && !voice.isNetworkConnectionRequired();
            }
            TextToSpeech engine;
            WebView webView;
          }
          JAVA
          javac -encoding UTF-8 -cp "${ANDROID_HOME}/platforms/android-36/android.jar" TtsApiProbe.java
          test -s TtsApiProbe.class
          echo 'P133 Android 36 TTS API COMPILE PASS (not a production app)'
      - name: Do not upload artifacts or APK
        run: test ! -e app-release.apk
