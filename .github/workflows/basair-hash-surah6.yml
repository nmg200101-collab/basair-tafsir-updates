name: basair-surah6-normalize-qa

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/basair-hash-surah6.yml'

permissions:
  contents: write

jobs:
  normalize-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize publication metadata and validate
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('.')
          d=root/'surah-006'/'001'
          files=[('part-001-025.json',1,25),('part-026-050.json',26,50),('part-051-075.json',51,75),('part-076-100.json',76,100),('part-101-125.json',101,125),('part-126-150.json',126,150),('part-151-165.json',151,165)]
          required=('meaning','bayan','tadabbur','summary')
          for fn,lo,hi in files:
              p=d/fn
              o=json.loads(p.read_text(encoding='utf-8'))
              ayahs=o.get('ayahs',[])
              if fn not in ('part-001-025.json','part-151-165.json'):
                  o={'schema':'basair-tafsir-part-v1','surah':6,'name':'الأنعام','content_version':'001','from':lo,'to':hi,'ayah_count':len(ayahs),'ayahs':ayahs}
                  p.write_text(json.dumps(o,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          expected=1; errors=[]
          for fn,lo,hi in files:
              p=d/fn; b=p.read_bytes(); o=json.loads(b); ayahs=o.get('ayahs',[])
              if o.get('schema')!='basair-tafsir-part-v1' or o.get('surah')!=6 or o.get('name')!='الأنعام' or o.get('content_version')!='001' or o.get('from')!=lo or o.get('to')!=hi or o.get('ayah_count')!=hi-lo+1 or len(ayahs)!=hi-lo+1:
                  errors.append('metadata:'+fn)
              for a in ayahs:
                  if a.get('ayah')!=expected: errors.append(f'sequence:{fn}:{a.get("ayah")}!={expected}')
                  for k in required:
                      if not isinstance(a.get(k),str) or not a[k].strip(): errors.append(f'missing:{fn}:{a.get("ayah")}:{k}')
                  if 'knowledge' in a and (not isinstance(a['knowledge'],str) or not a['knowledge'].strip()): errors.append(f'empty_knowledge:{fn}:{a.get("ayah")}')
                  expected+=1
              print(f'PART file=surah-006/001/{fn} from={lo} to={hi} bytes={len(b)} sha256={hashlib.sha256(b).hexdigest()}')
          print(f'QA expected_next={expected} errors={json.dumps(errors,ensure_ascii=False)}')
          if expected!=166 or errors: raise SystemExit(1)
          PY
          if git diff --quiet -- surah-006/001; then
            echo 'No normalization changes needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add surah-006/001/part-026-050.json surah-006/001/part-051-075.json surah-006/001/part-076-100.json surah-006/001/part-101-125.json surah-006/001/part-126-150.json
            git commit -m 'Normalize Surah 6 publication part metadata'
            git push origin HEAD:main
          fi