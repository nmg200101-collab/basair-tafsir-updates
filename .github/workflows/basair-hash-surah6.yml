name: basair-surah6-publish-manifest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/basair-hash-surah6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revalidate parts and merge Surah 6 into latest manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('.')
          mf=root/'basair-tafsir-manifest.json'
          manifest=json.loads(mf.read_text(encoding='utf-8'))
          before_keys=set(manifest.get('surahs',{}).keys())
          files=[('part-001-025.json',1,25),('part-026-050.json',26,50),('part-051-075.json',51,75),('part-076-100.json',76,100),('part-101-125.json',101,125),('part-126-150.json',126,150),('part-151-165.json',151,165)]
          expected=1; errors=[]; parts=[]
          required=('meaning','bayan','tadabbur','summary')
          for fn,lo,hi in files:
              p=root/'surah-006'/'001'/fn
              b=p.read_bytes(); o=json.loads(b); ayahs=o.get('ayahs',[])
              if o.get('schema')!='basair-tafsir-part-v1' or o.get('surah')!=6 or o.get('from')!=lo or o.get('to')!=hi or o.get('ayah_count')!=hi-lo+1 or len(ayahs)!=hi-lo+1:
                  errors.append('metadata:'+fn)
              for a in ayahs:
                  if a.get('ayah')!=expected: errors.append(f'sequence:{fn}:{a.get("ayah")}!={expected}')
                  for k in required:
                      if not isinstance(a.get(k),str) or not a[k].strip(): errors.append(f'missing:{fn}:{a.get("ayah")}:{k}')
                  if 'knowledge' in a and (not isinstance(a['knowledge'],str) or not a['knowledge'].strip()): errors.append(f'empty_knowledge:{fn}:{a.get("ayah")}')
                  expected+=1
              parts.append({'from':lo,'to':hi,'file':f'surah-006/001/{fn}','sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          if expected!=166 or errors:
              print('QA_FAIL',errors); raise SystemExit(1)
          expected_hashes=['7be97aea23a3f45b884f49d1d66c4e412fa79ff77a3c7f43108f7179c5964055','b498d24a6dcc71117a913eb11a7a1cc5df98c554dd9871c1cf30801a86017952','c872bd4d74c868a417129cb773397aaab31856e7448f93712d7577e2e3f1d708','c7f4b78ae3e8cac559cebc4a2787bc66dfdb7fc8176ddfe12373b1265a88ee88','037541c10776e4266fbc0416bc09bc2c1e94f61a8e4bfafcb3194b2cfac3ee25','f2351952616704f284a2943327568ab6d9af199e33b74c34c1ff605e15d4dbdf','dfafa5b8006afac87ad7d6370cf2cddef0487a5a69c4363744cc979ed4d8b13f']
          if [x['sha256'] for x in parts] != expected_hashes:
              print('HASH_DRIFT'); raise SystemExit(1)
          manifest.setdefault('surahs',{})['6']={'name':'الأنعام','content_version':'001','ayah_count':165,'parts':parts}
          if not before_keys.issubset(set(manifest['surahs'].keys())):
              raise SystemExit('Existing published surah removed')
          mf.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('MANIFEST_READY existing=',sorted(before_keys),'now=',sorted(manifest['surahs'].keys()))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add basair-tafsir-manifest.json
          git commit -m 'Publish Basair tafsir Surah 6 in manifest'
          git push origin HEAD:main