name: B231 Android Tooling

on:
  push:
    branches:
      - b231-tooling-temp-20260923

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and pack public Android tools
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          mkdir -p out
          cp -a "$ANDROID_HOME/build-tools/36.0.0" out/build-tools
          cp "$ANDROID_HOME/platforms/android-36/android.jar" out/android.jar
          BUNDLE_URL="$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name'].startswith('bundletool-all-') and a['name'].endswith('.jar')))")"
          curl -fL "$BUNDLE_URL" -o out/bundletool.jar
          test -s out/build-tools/d8
          test -s out/build-tools/apksigner
          test -s out/build-tools/zipalign
          test -s out/android.jar
          test -s out/bundletool.jar
      - name: Upload B231 tooling
        uses: actions/upload-artifact@v4
        with:
          name: b231-android-tooling
          path: out
          if-no-files-found: error
          retention-days: 1
