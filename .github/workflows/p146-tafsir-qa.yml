name: P146 Tafsir control placement and subtle selected tabs QA (temporary)
on:
  pull_request:
    paths:
      - 'p146/**'
      - 'p121/owner-qa/modules/tafsir/p146-*'
      - '.github/workflows/p146-tafsir-qa.yml'
permissions:
  contents: read
jobs:
  tafsir:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: node --check p121/owner-qa/modules/tafsir/p146-reader-polish.js
      - name: Tafsir-only boundaries and no cloned controls
        run: node p146/tests/test-p146-static.cjs
      - name: QuranEnc timeout recovery and bounded fallback preserved
        run: node p146/tests/test-p146-loading-recovery.cjs
      - name: Chromium live DOM mic beside ayah, small note at bottom, subtle selected tabs
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --allow-file-access-from-files --virtual-time-budget=8000 \
            --dump-dom "file://$PWD/p146/tests/p146-mic-note-tabs-browser.html" 2>/dev/null > /tmp/p146-browser.html
          sed -n '/<pre id="result">/,/<\/pre>/p' /tmp/p146-browser.html | head -2
          grep -F '"pass":true' /tmp/p146-browser.html
