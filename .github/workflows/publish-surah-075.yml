name: Publish Surah 075

on:
  push:
    paths:
      - '.github/workflows/publish-surah-075.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish Surah 75 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import base64, zlib, json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          payload=''
          ayahs=json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          compact=lambda x: json.dumps(x,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          h=lambda b: hashlib.sha256(b).hexdigest()
          if [x.get('ayah') for x in ayahs] != list(range(1,41)): raise SystemExit('Full ayah sequence error')
          for x in ayahs:
              for k in ('ayah','meaning','bayan','tadabbur','summary'):
                  if k not in x or (k!='ayah' and (not isinstance(x[k],str) or not x[k].strip())): raise SystemExit(f'Missing {k} at ayah {x.get("ayah")}')
          canonical=h(compact(ayahs))
          if canonical!='ef84e0ad3d09bce40878e8f0e98a86bb3a9a568d72d947d0131dea85a317e070': raise SystemExit(f'Canonical SHA-256 mismatch: {canonical}')
          mp=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('schema')!='basair-tafsir-update-v2' or manifest.get('version')!=2: raise SystemExit('Manifest schema/version error')
          existing=manifest.get('surahs',{}).get('75')
          if existing:
              if existing.get('ayah_count')==40 and existing.get('canonical_sha256')==canonical:
                  print('Surah 75 already published with same canonical hash')
                  raise SystemExit(0)
              raise SystemExit('Surah 75 already exists with different content; refusing overwrite')
          parts=[]
          for a,b in ((1,25),(26,40)):
              obj={'schema':'basair-tafsir-part-v1','surah':75,'name':'القيامة','content_version':'001','from':a,'to':b,'ayah_count':b-a+1,'ayahs':ayahs[a-1:b]}
              raw=compact(obj)
              sha=h(raw); size=len(raw)
              rel=f'surah-075/001/part-{a:03d}-{b:03d}.json'
              p=ROOT/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(raw)
              chk=json.loads(raw.decode('utf-8'))
              if chk['from']!=a or chk['to']!=b or chk['ayah_count']!=(b-a+1): raise SystemExit(f'Range/count error {rel}')
              if [x['ayah'] for x in chk['ayahs']]!=list(range(a,b+1)): raise SystemExit(f'Ayah sequence error {rel}')
              parts.append({'from':a,'to':b,'file':rel,'sha256':sha,'bytes':size})
          manifest['surahs']['75']={'name':'القيامة','content_version':'001','ayah_count':40,'parts':parts,'canonical_sha256':canonical}
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['75'],ensure_ascii=False))
          PY
            git add surah-075/001 basair-tafsir-manifest.json
            if git diff --cached --quiet; then
              echo "Nothing to commit"
              exit 0
            fi
            git commit -m 'Publish Basair tafsir Surah 75 Al-Qiyamah'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying on latest main..."
            sleep $((attempt*2))
          done
          echo "Failed to publish after retries" >&2
          exit 1
