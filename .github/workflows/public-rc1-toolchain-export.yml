name: Basair PUBLIC RC1 Toolchain Export

on:
  push:
    branches:
      - basair-quran-public-rc1
    paths:
      - ".github/workflows/public-rc1-toolchain-export.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover and prepare Android SDK
        shell: bash
        run: |
          set -u
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p rc1-diagnostics rc1-toolchain/build-tools rc1-toolchain/platforms
          {
            echo "SDK_ROOT=$SDK_ROOT"
            echo "JAVA_HOME=${JAVA_HOME:-}"
            echo "--- platforms ---"
            ls -la "$SDK_ROOT/platforms" 2>&1 || true
            echo "--- build-tools ---"
            ls -la "$SDK_ROOT/build-tools" 2>&1 || true
            echo "--- sdkmanager ---"
            command -v sdkmanager || true
            find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null || true
          } | tee rc1-diagnostics/android-sdk.txt

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] && [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" || true
          fi

          if [ -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            cp -a "$SDK_ROOT/platforms/android-36" rc1-toolchain/platforms/android-36
          fi

          BT="$(ls -1 "$SDK_ROOT/build-tools" 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$BT" ] && [ -d "$SDK_ROOT/build-tools/$BT" ]; then
            cp -a "$SDK_ROOT/build-tools/$BT" "rc1-toolchain/build-tools/$BT"
            printf '%s\n' "$BT" > rc1-toolchain/BUILD_TOOLS_VERSION.txt
          fi
          printf '%s\n' "36" > rc1-toolchain/TARGET_API.txt
          test -f rc1-toolchain/platforms/android-36/android.jar

      - name: Export current Quran Library snapshot
        if: always()
        shell: bash
        run: |
          cp -a library rc1-library-snapshot

      - name: Download current bundletool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc1-bundletool
          API="$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest)"
          URL="$(printf '%s' "$API" | jq -r '.assets[] | select(.name | test("bundletool-all.*\\.jar$")) | .browser_download_url' | head -1)"
          test -n "$URL"
          curl -fL "$URL" -o rc1-bundletool/bundletool.jar
          java -jar rc1-bundletool/bundletool.jar version | tee rc1-bundletool/VERSION.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASAIR-PUBLIC-RC1-ANDROID-DIAGNOSTICS
          path: rc1-diagnostics/
          compression-level: 6

      - name: Upload toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASAIR-PUBLIC-RC1-ANDROID36-TOOLCHAIN
          path: rc1-toolchain/
          compression-level: 6

      - name: Upload library snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASAIR-PUBLIC-RC1-LIBRARY-SNAPSHOT
          path: rc1-library-snapshot/
          compression-level: 6

      - name: Upload bundletool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BASAIR-PUBLIC-RC1-BUNDLETOOL
          path: rc1-bundletool/
          compression-level: 6
