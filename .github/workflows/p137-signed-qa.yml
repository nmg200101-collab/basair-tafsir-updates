name: P137 signed owner QA pre-release verification
on:
  pull_request:
    paths:
      - 'p137/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p137-signed-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate signed RSA envelope and six OTA assets
        run: node p137/tests/test-p137-signed-release.cjs
      - name: Recheck narrator voice recovery and settings
        run: |
          node p137/tests/test-p137-natiq.cjs
          node p137/tests/test-p137-narrator-integration.cjs
          node p137/tests/test-p137-hot-update-controls.cjs
          node p137/tests/test-p137-auto-next.cjs
