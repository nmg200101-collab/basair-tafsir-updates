name: P139 signed owner-only QA verification (temporary)
on:
  pull_request:
    paths:
      - 'p139/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p139-signed-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner RSA signature and all six SHA256 assets
        run: node p139/tests/test-p139-signed-release.cjs
      - name: Recheck old reciters, local narration, Next and one-wave controls
        run: |
          node p139/tests/test-p139-natiq.cjs
          node p139/tests/test-p139-narrator-integration.cjs
          node p139/tests/test-p139-auto-next.cjs
          node p139/tests/test-p139-wave-toggle.cjs
