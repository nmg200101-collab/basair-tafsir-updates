name: Build Basair Quran V1 Tajwid Offline Assets

on:
  push:
    branches:
      - release-v1-offline-assets-build-20260918
    paths:
      - ".github/workflows/build-release-v1-tajwid-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify 604 Tajwid pages
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          root=pathlib.Path("tajwid-assets"); root.mkdir(parents=True,exist_ok=True)
          UA="BasairQuran-V1-Tajwid-Builder/1.0"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read()
          def one(p):
              dst=root/f"{p:03d}.jpg"
              if dst.exists() and dst.stat().st_size>10000:
                  d=dst.read_bytes(); return p,len(d),hashlib.sha256(d).hexdigest()
              urls=[
                  f"https://cdn.jsdelivr.net/gh/QuranHub/quran-pages-images@main/easyquran.com/hafs-tajweed/{p}.jpg",
                  f"https://raw.githubusercontent.com/QuranHub/quran-pages-images/main/easyquran.com/hafs-tajweed/{p}.jpg",
              ]
              last=None
              for n in range(4):
                  for u in urls:
                      try:
                          d=get(u)
                          if len(d)<10000: raise RuntimeError(f"small {len(d)}")
                          dst.write_bytes(d); return p,len(d),hashlib.sha256(d).hexdigest()
                      except Exception as e:last=e
                  time.sleep(min(8,1.5**n))
              raise RuntimeError(f"page {p}: {last}")
          print("SAMPLE",one(1)[:2])
          out=[]; bad=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              futs={ex.submit(one,p):p for p in range(1,605)}
              for f in concurrent.futures.as_completed(futs):
                  p=futs[f]
                  try:
                      r=f.result();out.append(r);print("OK",p,r[1])
                  except Exception as e:
                      bad.append([p,repr(e)]);print("ERR",p,repr(e))
          if bad:
              pathlib.Path("tajwid-errors.json").write_text(json.dumps(bad,indent=2),encoding="utf-8")
              raise SystemExit(f"{len(bad)} tajwid pages failed")
          out.sort()
          if len(out)!=604: raise SystemExit(f"count {len(out)}")
          m={"schema":"basair-v1-tajwid-pages","count":604,"total_bytes":sum(x[1] for x in out),
             "files":[{"page":p,"path":f"tajwid-assets/{p:03d}.jpg","bytes":b,"sha256":s} for p,b,s in out]}
          pathlib.Path("TAJWID-MANIFEST.json").write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"count":604,"total_bytes":m["total_bytes"]},ensure_ascii=False))
          PY

      - name: Package
        shell: bash
        run: |
          zip -0 -r BASAIR-QURAN-V1-TAJWID-PAGES.zip tajwid-assets TAJWID-MANIFEST.json >/dev/null
          sha256sum BASAIR-QURAN-V1-TAJWID-PAGES.zip | tee BASAIR-QURAN-V1-TAJWID-PAGES.zip.sha256
          du -h BASAIR-QURAN-V1-TAJWID-PAGES.zip

      - name: Upload Tajwid bundle
        uses: actions/upload-artifact@v4
        with:
          name: BASAIR-QURAN-V1-TAJWID-PAGES
          path: |
            BASAIR-QURAN-V1-TAJWID-PAGES.zip
            BASAIR-QURAN-V1-TAJWID-PAGES.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
