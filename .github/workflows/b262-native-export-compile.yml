name: B262 native export bridge compile

on:
  push:
    branches: [b262-native-export-compile]
    paths:
      - 'tmp-b262/**'
      - '.github/workflows/b262-native-export-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java bridge
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          test -f "$ANDROID_JAR"
          test -x "$D8"
          rm -rf out dexin dexout artifact
          mkdir -p out dexin dexout artifact
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d out tmp-b262/MainActivity.java tmp-b262/Rc1Activity.java
          cp out/app/basair/quran/Rc1Activity*.class dexin/
          "$D8" --lib "$ANDROID_JAR" --min-api 23 --output dexout dexin/*.class
          cp dexout/classes.dex artifact/classes2.dex
          sha256sum artifact/classes2.dex
      - uses: actions/upload-artifact@v4
        with:
          name: b262-native-bridge
          path: artifact/classes2.dex
          if-no-files-found: error
