name: Basair Tafsir Generic Publisher

on:
  push:
    paths:
      - 'surah-*/001/part-*.json'
      - 'publish-queue/tafsir-surah-*-001.json'
      - '.github/workflows/basair-tafsir-generic-publisher.yml'

permissions:
  contents: write

concurrency:
  group: basair-tafsir-manifest-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target surah
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import json, pathlib, re, os, subprocess

          ROOT = pathlib.Path('.')
          manifest = json.loads((ROOT/'basair-tafsir-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('schema') != 'basair-tafsir-update-v2':
              raise SystemExit('Manifest schema changed; refusing publish')

          def next_target():
              core = next((x for x in range(80,115) if str(x) not in manifest.get('surahs',{})), None)
              if core is not None:
                  return core
              return next((x for x in (1,2,12) if str(x) not in manifest.get('surahs',{})), None)

          first_missing = next_target()
          if first_missing is None:
              raise SystemExit('All target surahs are already published')

          changed = subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA']],
              text=True
          ).splitlines()

          part_surahs = sorted({
              int(m.group(1))
              for p in changed
              for m in [re.match(r'^surah-([0-9]{3})/001/part-.*\.json$', p)]
              if m
          })
          marker_surahs = sorted({
              int(m.group(1))
              for p in changed
              for m in [re.match(r'^publish-queue/tafsir-surah-([0-9]{3})-001\.json$', p)]
              if m
          })

          if part_surahs:
              if len(part_surahs) != 1:
                  raise SystemExit(f'Multiple surahs staged in one commit: {part_surahs}')
              n = part_surahs[0]
              source = 'staged-part'
          elif marker_surahs:
              if len(marker_surahs) != 1:
                  raise SystemExit(f'Multiple publish markers in one commit: {marker_surahs}')
              n = marker_surahs[0]
              source = 'legacy-marker'
          elif '.github/workflows/basair-tafsir-generic-publisher.yml' in changed:
              n = first_missing
              source = 'workflow-bootstrap'
              if not (ROOT/f'surah-{n:03d}'/'001').exists():
                  raise SystemExit(f'Bootstrap found no staged directory for Surah {n}')
          else:
              raise SystemExit('No supported Tafsir publish trigger found')

          if n != first_missing:
              raise SystemExit(f'Out-of-order request: expected Surah {first_missing}, got {n}')

          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'TARGET_SURAH={n}\n')
              f.write(f'TRIGGER_SOURCE={source}\n')
          print(f'TARGET_SURAH={n} source={source}')
          PY

      - name: Validate staged surah and update manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, re, os

          ROOT = pathlib.Path('.')
          MANIFEST = ROOT / 'basair-tafsir-manifest.json'

          expected_counts = {
            1:7,2:286,12:111,
            80:42,81:29,82:19,83:36,84:25,85:22,86:17,87:19,88:26,
            89:30,90:20,91:15,92:21,93:11,94:8,95:8,96:19,97:5,
            98:8,99:8,100:11,101:11,102:8,103:3,104:9,105:5,106:4,
            107:7,108:3,109:6,110:3,111:5,112:4,113:5,114:6
          }
          expected_names = {
            1:'الفاتحة',2:'البقرة',12:'يوسف',
            80:'عبس',81:'التكوير',82:'الانفطار',83:'المطففين',84:'الانشقاق',
            85:'البروج',86:'الطارق',87:'الأعلى',88:'الغاشية',89:'الفجر',
            90:'البلد',91:'الشمس',92:'الليل',93:'الضحى',94:'الشرح',
            95:'التين',96:'العلق',97:'القدر',98:'البينة',99:'الزلزلة',
            100:'العاديات',101:'القارعة',102:'التكاثر',103:'العصر',
            104:'الهمزة',105:'الفيل',106:'قريش',107:'الماعون',
            108:'الكوثر',109:'الكافرون',110:'النصر',111:'المسد',
            112:'الإخلاص',113:'الفلق',114:'الناس'
          }

          def compact(obj):
              return json.dumps(obj, ensure_ascii=False, separators=(',', ':')).encode('utf-8')

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def norm(s):
              return re.sub(r'\s+', ' ', s).strip()

          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          if manifest.get('schema') != 'basair-tafsir-update-v2':
              raise SystemExit('Manifest schema changed; refusing publish')

          def next_target():
              core = next((x for x in range(80,115) if str(x) not in manifest.get('surahs',{})), None)
              if core is not None:
                  return core
              return next((x for x in (1,2,12) if str(x) not in manifest.get('surahs',{})), None)

          n = int(os.environ['TARGET_SURAH'])
          if n not in expected_counts:
              raise SystemExit(f'Surah {n} is outside the approved publisher targets')

          first_missing = next_target()
          if n != first_missing:
              raise SystemExit(f'Out-of-order publish: expected Surah {first_missing}, got {n}')
          if str(n) in manifest.get('surahs',{}):
              raise SystemExit(f'Surah {n} already published; refusing overwrite')

          if n in (1,2,12):
              if any(str(x) not in manifest.get('surahs',{}) for x in range(80,115)):
                  raise SystemExit('Legacy completion is blocked until Surahs 80..114 are complete')
              expected_legacy = next((x for x in (1,2,12) if str(x) not in manifest.get('surahs',{})), None)
              if n != expected_legacy:
                  raise SystemExit(f'Legacy order violation: expected Surah {expected_legacy}, got {n}')

          placeholder = re.compile(r'placeholder|todo|tbd|xxx', re.I)

          def load_surah(num):
              d = ROOT / f'surah-{num:03d}' / '001'
              files = sorted(d.glob('part-*.json'))
              if not files:
                  raise SystemExit(f'No staged parts for Surah {num}')
              ayahs, raws, parts = [], [], []
              expected_ayah = 1
              name = None
              for p in files:
                  raw = p.read_bytes()
                  obj = json.loads(raw.decode('utf-8'))
                  required = {'schema','surah','name','content_version','from','to','ayah_count','ayahs'}
                  if not required.issubset(obj):
                      raise SystemExit(f'Missing top-level fields in {p}')
                  if obj['schema'] != 'basair-tafsir-part-v1' or obj['surah'] != num or obj['content_version'] != '001':
                      raise SystemExit(f'Bad schema/meta in {p}')
                  if obj['from'] != expected_ayah:
                      raise SystemExit(f'Gap/order error in {p}: expected from={expected_ayah}')
                  if obj['ayah_count'] != len(obj['ayahs']) or obj['to'] != obj['from'] + len(obj['ayahs']) - 1:
                      raise SystemExit(f'Range/count mismatch in {p}')
                  if name is None:
                      name = obj['name']
                  elif name != obj['name']:
                      raise SystemExit(f'Inconsistent surah name in {p}')
                  for i, a in enumerate(obj['ayahs'], obj['from']):
                      if a.get('ayah') != i:
                          raise SystemExit(f'Ayah sequence error in {p}: expected {i}')
                      for k in ('meaning','bayan','tadabbur','summary'):
                          v = a.get(k)
                          if not isinstance(v, str) or not v.strip():
                              raise SystemExit(f'Missing {k} at Surah {num}:{i}')
                          if placeholder.search(v):
                              raise SystemExit(f'Placeholder in {k} at Surah {num}:{i}')
                      if 'knowledge' in a:
                          v = a['knowledge']
                          if not isinstance(v, str) or not v.strip() or placeholder.search(v):
                              raise SystemExit(f'Invalid knowledge at Surah {num}:{i}')
                      if 'references' in a and not isinstance(a['references'], list):
                          raise SystemExit(f'Invalid references at Surah {num}:{i}')
                  ayahs.extend(obj['ayahs'])
                  raws.append(raw)
                  parts.append({
                      'from': obj['from'], 'to': obj['to'], 'file': p.as_posix(),
                      'sha256': sha256(raw), 'bytes': len(raw)
                  })
                  expected_ayah = obj['to'] + 1

              for k in ('meaning','bayan','tadabbur','summary'):
                  vals = [norm(a[k]) for a in ayahs]
                  if len(vals) != len(set(vals)):
                      raise SystemExit(f'Exact/normalized duplicate detected in {k}')

              return name, ayahs, raws, parts

          candidates = {
              'ayahs_compact': lambda num,name,a,r,p: compact(a),
              'surah_ayahs_compact': lambda num,name,a,r,p: compact({'surah':num,'ayahs':a}),
              'canonical_object': lambda num,name,a,r,p: compact({'surah':num,'name':name,'content_version':'001','ayah_count':len(a),'ayahs':a}),
              'raw_concat': lambda num,name,a,r,p: b''.join(r),
              'raw_newline': lambda num,name,a,r,p: b'\n'.join(r),
              'part_hashes_concat': lambda num,name,a,r,p: ''.join(x['sha256'] for x in p).encode(),
              'part_hashes_json': lambda num,name,a,r,p: compact([x['sha256'] for x in p]),
              'parts_meta_compact': lambda num,name,a,r,p: compact(p),
          }

          anchor = 114 if n == 1 else n - 1
          if str(anchor) not in manifest.get('surahs',{}):
              raise SystemExit(f'Canonical anchor Surah {anchor} is not published')
          anchor_name, anchor_ayahs, anchor_raws, anchor_parts = load_surah(anchor)
          target = manifest['surahs'][str(anchor)]['canonical_sha256']
          recipe = next((k for k,f in candidates.items() if sha256(f(anchor,anchor_name,anchor_ayahs,anchor_raws,anchor_parts)) == target), None)
          if recipe is None:
              raise SystemExit(f'Could not infer canonical SHA recipe from anchor Surah {anchor}')

          name, ayahs, raws, parts = load_surah(n)
          if name != expected_names[n]:
              raise SystemExit(f'Wrong Surah {n} name: {name!r}')
          if len(ayahs) != expected_counts[n]:
              raise SystemExit(f'Wrong ayah count for Surah {n}: expected {expected_counts[n]}, got {len(ayahs)}')
          if [a['ayah'] for a in ayahs] != list(range(1, expected_counts[n] + 1)):
              raise SystemExit(f'Final sequence check failed for Surah {n}')

          canonical = sha256(candidates[recipe](n, name, ayahs, raws, parts))
          manifest['surahs'][str(n)] = {
              'name': name,
              'content_version': '001',
              'ayah_count': expected_counts[n],
              'parts': parts,
              'canonical_sha256': canonical,
          }
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          print(f'QA=PASS surah={n} name={name} ayahs={len(ayahs)} parts={len(parts)} source={os.environ.get("TRIGGER_SOURCE")}')
          print(f'canonical_recipe={recipe}')
          print(f'canonical_sha256={canonical}')
          print('parts=' + json.dumps(parts, ensure_ascii=False))
          PY

      - name: Commit manifest atomically
        shell: bash
        run: |
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add basair-tafsir-manifest.json
          git commit -m "Publish Basair tafsir Surah $TARGET_SURAH"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify published commit and raw server
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request, time

          n = int(os.environ['TARGET_SURAH'])
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          base = f'https://raw.githubusercontent.com/nmg200101-collab/basair-tafsir-updates/{sha}'

          def get_json(path):
              last = None
              for _ in range(8):
                  try:
                      with urllib.request.urlopen(base + '/' + path, timeout=15) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last = e
                      time.sleep(2)
              raise SystemExit(f'Raw verification failed for {path}: {last}')

          manifest = get_json('basair-tafsir-manifest.json')
          entry = manifest.get('surahs',{}).get(str(n))
          if not entry:
              raise SystemExit(f'Surah {n} missing from raw manifest after publish')

          total = 0
          expected = 1
          for p in entry['parts']:
              obj = get_json(p['file'])
              if obj.get('surah') != n or obj.get('from') != expected or obj.get('to') != p['to']:
                  raise SystemExit(f'Raw part verification failed: {p["file"]}')
              total += len(obj.get('ayahs',[]))
              expected = obj['to'] + 1
          if total != entry['ayah_count']:
              raise SystemExit(f'Raw total ayah count mismatch: {total} != {entry["ayah_count"]}')

          print(f'SERVER_VERIFY=PASS surah={n} commit={sha} canonical={entry["canonical_sha256"]}')
          PY
