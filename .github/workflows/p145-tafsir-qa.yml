name: P145 Tafsir owner-only top controls and resilient loading QA (temporary)
on:
  pull_request:
    paths:
      - 'p145/**'
      - 'p121/owner-qa/modules/tafsir/p145-*'
      - '.github/workflows/p145-tafsir-qa.yml'
permissions:
  contents: read
jobs:
  tafsir:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: node --check p121/owner-qa/modules/tafsir/p145-reader-polish.js
      - name: Check safety boundaries
        run: node p145/tests/test-p145-static.cjs
      - name: Stuck per-ayah QuranEnc request recovery with bounded GitHub fallback
        run: node p145/tests/test-p145-loading-recovery.cjs
      - name: Chromium real loading and top control UI at 125 percent
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --allow-file-access-from-files --virtual-time-budget=9000 \
            --dump-dom "file://$PWD/p145/tests/p145-tafsir-browser-fixture.html" 2>/dev/null > /tmp/p145-dom.html
          sed -n '/<pre id="result">/,/<\/pre>/p' /tmp/p145-dom.html | head -6
          grep -F '"pass":true' /tmp/p145-dom.html
