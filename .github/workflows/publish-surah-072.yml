name: Publish staged Surah 72

on:
  push:
    paths:
      - '.github/workflows/publish-surah-072.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and publish Surah 72 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          ranges=[(1,25),(26,28)]
          expected={
            (1,25):('9f55ba678925643bf27bfdf8a5e6ea976b83e0af12914d8dc81a693646cee5bd',15951),
            (26,28):('b64a2045ce5185f5c268b4c16fb43a9a96d364061c340983977badfa2c0c465e',2195),
          }
          def compact(x): return json.dumps(x,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def h(b): return hashlib.sha256(b).hexdigest()
          ayahs=[]; parts=[]
          for a,b in ranges:
              rel=f'surah-072/001/part-{a:03d}-{b:03d}.json'
              p=ROOT/rel
              raw=p.read_bytes()
              sha=h(raw); size=len(raw)
              if (sha,size)!=expected[(a,b)]: raise SystemExit(f'SHA/size mismatch {rel}: {sha} {size}')
              chk=json.loads(raw.decode('utf-8'))
              if chk.get('schema')!='basair-tafsir-part-v1' or chk.get('surah')!=72 or chk.get('name')!='الجن' or chk.get('content_version')!='001': raise SystemExit(f'Header error {rel}')
              if chk.get('from')!=a or chk.get('to')!=b or chk.get('ayah_count')!=(b-a+1): raise SystemExit(f'Range/count error {rel}')
              seq=[x.get('ayah') for x in chk.get('ayahs',[])]
              if seq!=list(range(a,b+1)): raise SystemExit(f'Ayah sequence error {rel}')
              ayahs.extend(chk['ayahs'])
              parts.append({'from':a,'to':b,'file':rel,'sha256':sha,'bytes':size})
          if [x.get('ayah') for x in ayahs] != list(range(1,29)): raise SystemExit('Full ayah sequence error')
          for x in ayahs:
              for k in ('ayah','meaning','bayan','tadabbur','summary'):
                  if k not in x or (k!='ayah' and (not isinstance(x[k],str) or not x[k].strip())): raise SystemExit(f'Missing {k} at ayah {x.get("ayah")}')
          canonical=h(compact(ayahs))
          if canonical!='e0a84b15731bbe78e7658d35ed3adee727184ec47c16196b7fd9c4f7df132ffe': raise SystemExit(f'Canonical SHA-256 mismatch: {canonical}')
          mp=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('schema')!='basair-tafsir-update-v2' or manifest.get('version')!=2: raise SystemExit('Manifest schema/version error')
          existing=manifest.setdefault('surahs',{}).get('72')
          new={'name':'الجن','content_version':'001','ayah_count':28,'parts':parts,'canonical_sha256':canonical}
          if existing is not None and existing!=new: raise SystemExit('Surah 72 already exists with different content')
          manifest['surahs']['72']=new
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(new,ensure_ascii=False))
          PY
            git add basair-tafsir-manifest.json surah-072/001
            if git diff --cached --quiet; then
              echo 'Already published and verified.'
              exit 0
            fi
            git commit -m 'Publish Tafsir Basair Surah 72 Al-Jinn'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."
            sleep $((attempt*2))
          done
          echo 'Failed to publish after retries' >&2
          exit 1
