name: Basair PUBLIC RC1 Library Snapshot

on:
  push:
    branches:
      - basair-quran-public-rc1
    paths:
      - ".github/workflows/public-rc1-library-snapshot.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify library
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("library")
          m=json.load(open(root/"manifest.json",encoding="utf-8"))
          i=json.load(open(root/"topics/index.json",encoding="utf-8"))
          topics=i.get("topics", i if isinstance(i,list) else [])
          assert m["libraryVersion"]=="1.3.6"
          assert topics
          for t in topics:
              p=pathlib.Path(t["path"])
              assert p.exists(), p
          print("libraryVersion",m["libraryVersion"],"topics",len(topics))
          PY
      - name: Upload repaired library
        uses: actions/upload-artifact@v4
        with:
          name: BASAIR-PUBLIC-RC1-LIBRARY-1.3.6
          path: library/
          compression-level: 6
