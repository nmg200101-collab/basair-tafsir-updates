name: Publish staged Surah 36

on:
  push:
    paths:
      - '.github/workflows/publish-surah-036.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main
      - name: Complete validate hash and publish Surah 36
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          entries=[
          (26,'قيل له بعد قتله: ادخل الجنة، فلما رأى كرامة الله قال يا ليت قومي يعلمون.','انتقل المؤمن من أذى قومه إلى كرامة الجنة مباشرة.','الثبات على الحق قد تكون عاقبته أعظم مما يرى الإنسان في لحظة البلاء.','كرامة المؤمن بعد الثبات.'),
          (27,'ليعلم قومي بما غفر لي ربي وجعلني من المكرمين.','تمنى الخير لقومه حتى بعد أذاهم له.','صفاء القلب يظهر في إرادة الهداية حتى للمسيء.','المؤمن يتمنى هداية قومه.'),
          (28,'وما أنزلنا على قومه من بعده جندًا من السماء، وما كنا محتاجين إلى إنزال جند.','هلاك المكذبين لا يحتاج إلى قوة عظيمة؛ أمر الله نافذ بأيسر سبب.','لا تقيس سلطان الله بكثرة الوسائل الظاهرة.','قدرة الله لا تحتاج إلى جند.'),
          (29,'ما كانت عقوبتهم إلا صيحة واحدة فإذا هم خامدون.','جاء الهلاك سريعًا حاسمًا بعد تمام الحجة.','إمهال الله لا يعني العجز، فإذا جاء أمره فلا مرد له.','صيحة واحدة أنهت المكذبين.'),
          (30,'يا حسرة على العباد؛ ما يأتيهم رسول إلا كانوا به يستهزئون.','بيان تكرر موقف الاستهزاء بالرسل عبر الأمم.','لا تجعل السخرية من الناصح عادة تحجبك عن مراجعة نفسك.','حسرة على المستهزئين بالرسل.'),
          (31,'ألم يروا كم أهلكنا قبلهم من أمم وأنهم لا يرجعون إلى الدنيا.','دعت الآية للاعتبار بمصائر السابقين وانقطاع عودتهم.','التاريخ مدرسة لمن يقرأ العواقب لا الأخبار فقط.','الاعتبار بهلاك الأمم.'),
          (32,'وكل الخلائق سيحضرون جميعًا عند الله للحساب.','لا يفلت أحد من الجمع والحساب.','استعد للوقوف الفردي يوم يحضر الجميع.','الجميع محضرون للحساب.'),
          (33,'وآية لهم الأرض الميتة أحييناها وأخرجنا منها حبًا فمنه يأكلون.','إحياء الأرض دليل محسوس على القدرة والبعث والرزق.','انظر إلى الطعام اليومي بوصفه آية لا مجرد عادة.','إحياء الأرض ورزق الحب.'),
          (34,'وجعلنا فيها بساتين من نخيل وأعناب وفجرنا فيها من العيون.','تنوع الزروع والمياه من دلائل الرحمة والتسخير.','النعم المتكررة تستحق شكرًا متجددًا.','جنات وعيون من نعم الله.'),
          (35,'ليأكلوا من ثمره وما صنعته أيديهم استقلالًا، أفلا يشكرون؟','الثمر في أصله من خلق الله ولو باشر الإنسان أسبابه.','اعمل بالأسباب لكن لا تنسب النعمة إلى نفسك وحدك.','الثمر نعمة تستوجب الشكر.'),
          (36,'تنزه الله الذي خلق الأزواج كلها مما تنبت الأرض ومن أنفسهم ومما لا يعلمون.','التنوع والازدواج في الخلق شاهد على كمال الصنع.','كل اكتشاف جديد في الخلق يفتح بابًا أوسع للتسبيح.','تنوع الأزواج آية للخلق.'),
          (37,'وآية لهم الليل نسلخ منه النهار فإذا هم في ظلام.','تعاقب الضوء والظلمة بنظام ثابت آية على التدبير.','تكرار الظواهر لا يسلبها دلالتها على الخالق.','تعاقب الليل والنهار آية.'),
          (38,'والشمس تجري في مسار مقدر لها، ذلك تقدير العزيز العليم.','حركة الشمس واقعة ضمن تقدير محكم بعلم وقدرة.','النظام الكوني يربي القلب على الثقة بتقدير الله.','جريان الشمس بتقدير الله.'),
          (39,'والقمر قدرناه منازل حتى يعود في آخر الشهر دقيقًا منحنيا كالعذق القديم.','منازل القمر مضبوطة في دورة منتظمة.','راقب تغير القمر لتتذكر دقة السنن وتبدل الأحوال.','منازل القمر مقدرة.'),
          (40,'لا الشمس ينبغي لها أن تدرك القمر، ولا الليل سابق النهار، وكل في فلك يسبحون.','لكل جرم ونظام حد ومسار لا يختلط بغيره.','الكون المنظم يرفض تصور العبث والفوضى المطلقة.','كل جرم يجري في فلك.'),
          (41,'وآية لهم أنا حملنا ذريتهم في الفلك المشحون.','ذكرت نعمة حمل البشر في السفن وما ماثلها من وسائل النجاة.','وسائل النقل والأمان من نعم التسخير التي تستوجب الشكر.','حمل الناس في الفلك نعمة.'),
          (42,'وخلقنا لهم من مثله ما يركبون.','وسع الله للناس أسباب الركوب والتنقل.','انظر إلى تطور الوسائل بوصفه من تسخير الله للأسباب.','تسخير وسائل الركوب.'),
          (43,'وإن نشأ نغرقهم فلا مغيث لهم ولا هم ينقذون.','بقاء الإنسان في البحر مرهون بحفظ الله لا بالأسباب وحدها.','لا تجعل امتلاك الوسيلة ينسيك الحاجة إلى الحفظ الإلهي.','النجاة بالحفظ لا بالوسائل وحدها.'),
          (44,'إلا رحمة منا وتمتيعًا إلى حين.','النجاة والإمهال رحمة مؤقتة إلى أجل معلوم.','كل امتداد في العمر فرصة للعمل لا ضمان للبقاء.','النجاة رحمة إلى أجل.'),
          (45,'وإذا قيل لهم اتقوا ما أمامكم وما خلفكم لعلكم ترحمون أعرضوا.','دُعوا إلى التقوى من أسباب العذاب الماضية والآتية فلم يستجيبوا.','الرحمة ترتبط بالاستجابة للإنذار لا بمجرد سماعه.','دعوة إلى التقوى والرحمة.'),
          (46,'وما تأتيهم من آية من آيات ربهم إلا كانوا عنها معرضين.','المشكلة لم تكن في قلة الآيات بل في دوام الإعراض.','كثرة الدليل لا تنفع مع قرار مسبق بعدم الاستجابة.','الإعراض المتكرر عن الآيات.'),
          (47,'وإذا قيل لهم أنفقوا مما رزقكم الله قال الكافرون للمؤمنين: أنطعم من لو يشاء الله أطعمه؟ إن أنتم إلا في ضلال مبين.','احتجوا بالقدر ليبرروا البخل ويعطلوا واجب الرحمة.','لا تستخدم الإيمان بالقدر ذريعة لترك المسؤولية التي أمرك الله بها.','بطلان الاحتجاج بالقدر على البخل.'),
          (48,'ويقولون متى هذا الوعد إن كنتم صادقين.','استعجلوا الوعد استهزاء لا طلبًا للهداية.','لا تجعل تأخر الجزاء سببًا للاستخفاف بوعد الله.','استعجال المكذبين للوعد.'),
          (49,'ما ينتظرون إلا صيحة واحدة تأخذهم وهم يختصمون.','قد يأتي أمر الساعة بغتة في أثناء شؤون الناس العادية.','لا تؤجل الاستعداد لأن النهاية قد تقطع خططك فجأة.','الصيحة تأتي بغتة.'),
          (50,'فلا يستطيعون وصية ولا إلى أهلهم يرجعون.','مباغتة الساعة تمنع حتى إتمام أبسط شؤون الدنيا.','ما لا تستطيع تأجيله إلى لحظة الموت هو العمل الصالح الآن.','لا مهلة عند مجيء الساعة.'),
          (51,'ونفخ في الصور فإذا هم من القبور إلى ربهم يسرعون.','البعث يعيد الناس جميعًا من القبور إلى موقف الحساب.','تذكر أن طريق القبر ينتهي بالوقوف بين يدي الله.','النفخ في الصور والبعث.'),
          (52,'قالوا يا ويلنا من بعثنا من مرقدنا؟ هذا ما وعد الرحمن وصدق المرسلون.','يعترفون عند البعث بحقيقة ما كذبوا به في الدنيا.','لا تنتظر اليقين القهري؛ آمن قبل أن يصبح الإيمان مشاهدة لا اختيارًا.','اعتراف المكذبين بصدق الوعد.'),
          (53,'إن كانت إلا صيحة واحدة فإذا هم جميع لدينا محضرون.','جمع الخلائق على الله يسير ولا يحتاج إلى زمن طويل.','قدرة الله على جمع الجميع تؤكد دقة الحساب الفردي.','صيحة واحدة تجمع الخلق.'),
          (54,'فاليوم لا تظلم نفس شيئًا ولا تجزون إلا ما كنتم تعملون.','أساس الحكم يوم القيامة العدل المحض وموافقة الجزاء للعمل.','عدل الآخرة يحررك من اليأس من إنصاف لم يتحقق في الدنيا.','جزاء عادل بلا ظلم.'),
          (55,'إن أصحاب الجنة اليوم في شغل بما يسرهم متلذذون.','أهل الجنة في نعيم وفرح يملأ وقتهم.','اجعل مشقة الطاعة جسرًا إلى فراغ القلب من كل حزن هناك.','أهل الجنة في سرور.'),
          (56,'هم وأزواجهم في ظلال على الأرائك متكئون.','نعيم الجنة يجمع الأنس والراحة والكرامة.','صلاح الأسرة في الدنيا قد يكون طريقًا لاجتماع كريم في الآخرة.','راحة وأُنس في الجنة.'),
          (57,'لهم فيها فاكهة ولهم ما يدعون ويطلبون.','نعيم الجنة واسع يحقق الرغبات بلا عناء.','لا تبع النعيم الدائم بلذة عاجلة محرمة.','لأهل الجنة ما يشتهون.'),
          (58,'سلام قولًا من رب رحيم.','أعظم نعيم أهل الجنة سلام الله عليهم.','اطلب رضا الله؛ فهو أعظم من كل نعيم مادي.','سلام من الرب الرحيم.'),
          (59,'وامتازوا اليوم أيها المجرمون.','يفصل أهل الإجرام عن أهل الإيمان في الموقف.','الطرق المختلطة في الدنيا تنتهي إلى مصائر مفترقة.','تمييز المجرمين يوم القيامة.'),
          (60,'ألم أعهد إليكم يا بني آدم ألا تعبدوا الشيطان إنه لكم عدو مبين.','عبادة الشيطان تشمل طاعته في طريق التمرد على الله.','لا يكفي إعلان عداوة الشيطان مع اتباع خطواته.','عهد بترك طاعة الشيطان.'),
          (61,'وأن اعبدوني هذا صراط مستقيم.','العبودية لله هي الطريق الواضح المستقيم.','بساطة الطريق في التوحيد لا تعني سهولة الثبات عليه دون مجاهدة.','عبادة الله هي الصراط المستقيم.'),
          (62,'ولقد أضل الشيطان منكم خلقًا كثيرًا، أفلم تكونوا تعقلون.','التاريخ البشري شاهد على كثرة من استجاب لإغواء الشيطان.','العقل النافع يتعلم من سقوط الآخرين ولا يكرر الطريق نفسه.','إضلال الشيطان لأمم كثيرة.'),
          (63,'هذه جهنم التي كنتم توعدون.','تظهر الحقيقة التي طالما أنكرها المكذبون.','ما يخبر به الوحي اليوم سيصير مشاهدة غدًا.','جهنم هي الوعيد المصدق.'),
          (64,'ادخلوها اليوم بسبب كفركم.','ربط دخول النار بسبب واضح هو الكفر والإصرار.','العاقبة تُصنع باختيارات متراكمة في الدنيا.','النار جزاء الكفر.'),
          (65,'اليوم نختم على أفواههم وتكلمنا أيديهم وتشهد أرجلهم بما كانوا يكسبون.','تشهد الجوارح على صاحبها فلا يبقى مجال للإنكار.','اجعل أعضاءك شهود خير لك لا شهود إدانة عليك.','الجوارح تشهد على الأعمال.'),
          (66,'ولو نشاء لطمسنا أعينهم فتسابقوا إلى الطريق فكيف يبصرون.','الله قادر على سلب الحواس التي يعتمد عليها الإنسان.','اشكر نعمة البصر باستعمالها فيما يرضي الله.','قدرة الله على سلب البصر.'),
          (67,'ولو نشاء لمسخناهم في أماكنهم فما استطاعوا تقدمًا ولا رجوعًا.','القدرة التي تحفظ صورة الإنسان وحركته هي من الله.','سلامة الجسد والحركة نعمة مستمرة لا يضمنها أحد لنفسه.','الله قادر على المسخ والتعطيل.'),
          (68,'ومن نطل عمره ننكسه في الخلق، أفلا يعقلون.','طول العمر يعيد كثيرًا من مظاهر القوة إلى الضعف.','لا تؤجل الطاعة اعتمادًا على قوة لن تدوم.','طول العمر يعيد إلى الضعف.'),
          (69,'وما علمنا النبي الشعر وما ينبغي له، إن هو إلا ذكر وقرآن مبين.','نفت الآية أن يكون القرآن شعرًا، وقررت أنه وحي وذكر مبين.','تعامل مع القرآن بوصفه هداية وتشريعًا لا مجرد نص أدبي.','القرآن وحي لا شعر.'),
          (70,'لينذر من كان حي القلب ويحق القول على الكافرين.','ينتفع بالوحي من كان قلبه حيًا مستعدًا، وتقوم به الحجة على المعاند.','حياة القلب تقاس بقدر استجابته للذكر.','القرآن ينذر الأحياء القلوب.'),
          (71,'أولم يروا أنا خلقنا لهم مما عملت قدرتنا أنعامًا فهم لها مالكون.','تملك الإنسان للأنعام قائم على خلق الله وتسخيره.','الملكية أمانة لأن أصل ما تملك مخلوق لله.','الأنعام خلق وتسخير من الله.'),
          (72,'وذللناها لهم فمنها ركوبهم ومنها يأكلون.','سخر الله الحيوان للركوب والغذاء مع تفاوت قوته عن الإنسان.','التسخير يدعوك للرحمة بالمخلوق وعدم إساءة استعمال النعمة.','الأنعام مذللة للركوب والطعام.'),
          (73,'ولهم فيها منافع ومشارب، أفلا يشكرون.','تعدد منافع الأنعام يوسع دائرة الشكر المطلوبة.','عدد النعم لتعرف مقدار ما يستحقه المنعم من الحمد.','منافع الأنعام تستوجب الشكر.'),
          (74,'واتخذوا من دون الله آلهة لعلهم ينصرون.','طلبوا النصرة ممن لا يملكها استقلالًا عن الله.','لا تستبدل التوكل على الله بتعلق قلبي بأسباب عاجزة.','طلب النصرة من آلهة باطلة.'),
          (75,'لا تستطيع تلك الآلهة نصرهم، وهم لها جند محضرون.','انقلبت العلاقة؛ العابدون يدافعون عن آلهتهم بدل أن تنصرهم.','المعبود الباطل يحمّل صاحبه ولا يحمله.','الآلهة لا تنصر عابديها.'),
          (76,'فلا يحزنك قولهم؛ إنا نعلم ما يسرون وما يعلنون.','سلى الله نبيه بعلمه التام بأقوال المكذبين ونياتهم.','حين يؤذيك كلام الناس استحضر علم الله وعدله.','الله يعلم السر والعلن.'),
          (77,'أولم ير الإنسان أنا خلقناه من نطفة فإذا هو خصيم مبين.','نسي الإنسان أصل ضعفه ثم صار يجادل في قدرة خالقه.','تذكر بدايتك يقطع مادة الكبر والجدال المتعالي.','الإنسان من نطفة ثم يجادل.'),
          (78,'وضرب لنا مثلًا ونسي خلقه فقال من يحيي العظام وهي رميم.','استبعد البعث لأنه نسي الخلق الأول.','أقوى جواب عن استبعاد الإعادة هو تذكر البداية الأولى.','نسيان الخلق الأول سبب استبعاد البعث.'),
          (79,'قل يحييها الذي أنشأها أول مرة وهو بكل خلق عليم.','من قدر على الابتداء قدر على الإعادة، وعلمه محيط بالخلق.','حين تعجز عن تصور الكيفية لا تنس قدرة الخالق وعلمه.','الخالق الأول قادر على الإحياء.'),
          (80,'الذي جعل لكم من الشجر الأخضر نارًا فإذا أنتم منه توقدون.','جمع الله في الشيء الرطب سببًا للنار، وفي ذلك شاهد على إخراج الشيء من ضده.','لا تحبس قدرة الله في حدود ما ألفته من العلاقات الظاهرة.','إخراج النار من الشجر آية.'),
          (81,'أوليس الذي خلق السماوات والأرض بقادر على أن يخلق مثلهم؟ بلى وهو الخلاق العليم.','خلق السماوات والأرض أعظم في الحس من إعادة الإنسان، وهو دليل القدرة.','قارن المستبعد بما هو أعظم منه في الخلق لتتضح الحجة.','خالق السماوات قادر على البعث.'),
          (82,'إنما أمره إذا أراد شيئًا أن يقول له كن فيكون.','إرادة الله نافذة بلا عجز ولا مقاومة.','لا تجعل ضخامة المطلوب سببًا لضعف رجائك في قدرة الله.','أمر الله نافذ: كن فيكون.'),
          (83,'فتنزه الذي بيده ملكوت كل شيء وإليه ترجعون.','ختمت السورة بتنزيه الله وعموم ملكه وحتمية الرجوع إليه.','اجمع في قلبك بين تعظيم المالك والاستعداد للرجوع إليه.','الملك كله لله وإليه الرجوع.')]
          def compact(x): return json.dumps(x,ensure_ascii=False,separators=(',',':')).encode()
          def h(b): return hashlib.sha256(b).hexdigest()
          first=ROOT/'surah-036/001/part-001-025.json'
          if not first.exists(): raise SystemExit('Missing staged part 1-25')
          first_obj=json.loads(first.read_text(encoding='utf-8'))
          all_entries=[(x['ayah'],x['meaning'],x['bayan'],x['tadabbur'],x['summary']) for x in first_obj['ayahs']] + entries
          if [x[0] for x in all_entries] != list(range(1,84)): raise SystemExit('Ayah sequence error')
          ayahs=[{'ayah':a,'meaning':m,'bayan':b,'tadabbur':t,'summary':s} for a,m,b,t,s in all_entries]
          for x in ayahs:
              for k in ('ayah','meaning','bayan','tadabbur','summary'):
                  if k not in x or (k!='ayah' and not str(x[k]).strip()): raise SystemExit(f'Missing {k} at {x.get("ayah")}')
          ranges=[(1,25),(26,50),(51,75),(76,83)]
          parts=[]
          for a,z in ranges:
              subset=[x for x in ayahs if a<=x['ayah']<=z]
              obj={'schema':'basair-tafsir-part-v1','surah':36,'name':'يس','content_version':'001','from':a,'to':z,'ayah_count':len(subset),'ayahs':subset}
              p=ROOT/f'surah-036/001/part-{a:03d}-{z:03d}.json'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(compact(obj))
              raw=p.read_bytes()
              check=json.loads(raw)
              if check['ayah_count'] != z-a+1 or [x['ayah'] for x in check['ayahs']] != list(range(a,z+1)): raise SystemExit(f'Part validation failed {a}-{z}')
              parts.append({'from':a,'to':z,'file':p.as_posix(),'sha256':h(raw),'bytes':len(raw)})
          canonical=h(compact(ayahs))
          manifest_path=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['surahs']['36']={'name':'يس','content_version':'001','ayah_count':83,'parts':parts,'canonical_sha256':canonical}
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['36'],ensure_ascii=False))
          PY
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add basair-tafsir-manifest.json surah-036/001/*.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Basair tafsir Surah Ya-Sin 36'
          git pull --rebase origin main
          git push origin HEAD:main
