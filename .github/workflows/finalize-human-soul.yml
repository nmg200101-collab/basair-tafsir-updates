name: Finalize Human Soul Library Section
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-human-soul.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and finalize human-soul
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('.')
          now='2026-09-22T08:10:00+03:00'
          version='1.3.4'
          ids=['soul-weakness','soul-desire','soul-blameworthy','soul-peaceful','heart-disease','heart-hardness','heart-arrogance','heart-envy','from-sin-to-repentance','purification-self','seeking-forgiveness','repair-after-sin','fear-of-allah','hope-in-mercy','patience-trials','balance-fear-hope','heart-tranquility','contentment','steadfastness','reliance-heart']
          subcats={'soul-nature-states':['soul-weakness','soul-desire','soul-blameworthy','soul-peaceful'],'soul-heart-diseases':['heart-disease','heart-hardness','heart-arrogance','heart-envy'],'soul-repentance-purification':['from-sin-to-repentance','purification-self','seeking-forgiveness','repair-after-sin'],'soul-fear-hope-patience':['fear-of-allah','hope-in-mercy','patience-trials','balance-fear-hope'],'soul-tranquility-steadfastness':['heart-tranquility','contentment','steadfastness','reliance-heart']}
          def raw(p): return p.read_bytes()
          def sha(p): return hashlib.sha256(raw(p)).hexdigest()
          def dump(p,obj): p.write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          topics={}
          for tid in ids:
            p=root/'library/topics'/f'{tid}.json'
            if not p.exists(): raise SystemExit(f'MISSING {tid}')
            t=json.loads(p.read_text(encoding='utf-8'))
            if t.get('id')!=tid or t.get('categoryId')!='human-soul' or t.get('status')!='published': raise SystemExit(f'BAD META {tid}')
            if t.get('assets'): raise SystemExit(f'OPENING ASSET NOT ALLOWED {tid}')
            js=t.get('journeys') or []
            if not js or not all(j.get('stages') for j in js): raise SystemExit(f'EMPTY CONTENT {tid}')
            for j in js:
              for st in j['stages']:
                types={b.get('type') for b in st.get('blocks',[])}
                if not {'tafsir','thematic_link','reflection'}<=types: raise SystemExit(f'BLOCK SEPARATION {tid}')
            topics[tid]=t
          cats_p=root/'library/categories.json'; cats=json.loads(cats_p.read_text(encoding='utf-8'))
          targets={'human-soul',*subcats.keys()}
          seen=set()
          for c in cats:
            if c.get('id') in targets:
              c['version']=int(c.get('version',0))+1
              c['preparationStatus']='content-complete-no-opening-images'
              c['openingImagesStatus']='deferred'
              seen.add(c['id'])
          if seen!=targets: raise SystemExit('CATEGORY SET INCOMPLETE')
          dump(cats_p,cats)
          idx_p=root/'library/topics/index.json'; idx=json.loads(idx_p.read_text(encoding='utf-8'))
          existing={x['id']:x for x in idx.get('topics',[])}
          for sub, tids in subcats.items():
            for order,tid in enumerate(tids,1):
              t=topics[tid]; p=root/'library/topics'/f'{tid}.json'
              existing[tid]={'id':tid,'version':t.get('version',1),'status':'published','categoryId':'human-soul','subCategoryId':sub,'title':t['title'],'path':f'library/topics/{tid}.json','sha256':sha(p),'updatedAt':t.get('updatedAt',now),'displayOrder':order*10}
          idx['libraryVersion']=version
          idx['topics']=list(existing.values())
          dump(idx_p,idx)
          man_p=root/'library/manifest.json'; man=json.loads(man_p.read_text(encoding='utf-8'))
          old_ids={x.get('id') for x in man.get('items',[]) if x.get('entityType')=='topic'}
          itemmap={(x.get('entityType'),x.get('id')):x for x in man.get('items',[])}
          changed=[]
          for tid in ids:
            t=topics[tid]; p=root/'library/topics'/f'{tid}.json'
            it={'entityType':'topic','id':tid,'version':t.get('version',1),'path':f'library/topics/{tid}.json','sha256':sha(p),'bytes':len(raw(p)),'updatedAt':t.get('updatedAt',now)}
            itemmap[('topic',tid)]=it; changed.append(it)
          catitem={'entityType':'categories','id':'categories','version':int(man.get('categoriesVersion',0))+1,'path':'library/categories.json','sha256':sha(cats_p),'bytes':len(raw(cats_p)),'updatedAt':now}
          itemmap[('categories','categories')]=catitem
          man['libraryVersion']=version; man['publishedAt']=now
          man['categoriesVersion']=int(man.get('categoriesVersion',0))+1
          man['contentVersion']=int(man.get('contentVersion',0))+1
          man['summary']={'newTopics':sum(1 for x in ids if x not in old_ids),'updatedTopics':sum(1 for x in ids if x in old_ids),'newJourneys':sum(1 for x in ids if x not in old_ids),'newInsights':0,'newAssets':0,'updatedAssets':0,'message':'إكمال النصوص الفعلية لقسم «النفس الإنسانية في القرآن» في 20 موضوعًا، مع الفصل بين المعنى التفسيري والدلالة الموضوعية والاستنباط المنضبط، دون صور افتتاحية.'}
          man['items']=list(itemmap.values()); man['totalItems']=len(man['items'])
          man['changedItems']=[catitem]+changed
          man['catalog']={'categories':{'path':'library/categories.json','sha256':sha(cats_p),'bytes':len(raw(cats_p))},'topicsIndex':{'path':'library/topics/index.json','sha256':sha(idx_p),'bytes':len(raw(idx_p))}}
          lines=sorted(f"{x['path']}:{x['sha256']}" for x in man['items'])
          man['checksum']=hashlib.sha256('\n'.join(lines).encode()).hexdigest()
          if man['totalItems']!=len(man['items']): raise SystemExit('TOTAL ITEMS ERROR')
          dump(man_p,man)
          # Re-read and verify exact bytes/hashes after serialization.
          check=json.loads(man_p.read_text(encoding='utf-8'))
          for it in check['changedItems']:
            p=root/it['path']
            if sha(p)!=it['sha256'] or len(raw(p))!=it['bytes']: raise SystemExit(f'HASH/BYTES ERROR {it["path"]}')
          lines=sorted(f"{x['path']}:{x['sha256']}" for x in check['items'])
          if hashlib.sha256('\n'.join(lines).encode()).hexdigest()!=check['checksum']: raise SystemExit('CHECKSUM ERROR')
          print('OK',version,'topics',len(ids),'totalItems',check['totalItems'],'checksum',check['checksum'])
          PY
          git config user.name 'nmg200101-collab'
          git config user.email 'nmg200101@gmail.com'
          git rm .github/workflows/finalize-human-soul.yml
          git add library/categories.json library/topics/index.json library/manifest.json
          git commit -m 'library: complete human-soul section v1.3.4'
          git push origin main