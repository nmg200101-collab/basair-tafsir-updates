name: P167 transient Android touch regression
on:
  pull_request:
    paths:
      - "p167/**"
      - "p121/owner-qa/modules/tafsir/p167*"
      - ".github/workflows/p167-transient-qa.yml"
permissions:
  contents: read
jobs:
  p167-real-touch-follow:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original-owner Seq44 RSA and 10 asset hashes
        run: node p167/tests/test-p167-signed-release.cjs
      - name: Validate updated P130 JavaScript
        run: node --check p121/owner-qa/modules/tafsir/p167-tafsir-follow-stop-manual-touch.js
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real follow, stop and Android touchend without scroll
        run: node p167/tests/test-p167-real-android-touch.cjs
