name: P135 signed owner QA release verification (temporary)
on:
  pull_request:
    paths:
      - 'p135/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p135-signed-qa.yml'
permissions:
  contents: read
jobs:
  signature-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner RSA, version sequencing and all six SHA256 assets
        run: node p135/tests/test-p135-signed-release.cjs
      - name: Re-run real ayah and narrator integration mocks
        run: |
          node p135/tests/test-p135-reciter-bridge.cjs
          node p135/tests/test-p135-natiq.cjs
          node p135/tests/test-p135-narrator-integration.cjs
