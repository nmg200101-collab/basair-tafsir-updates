name: P138 signed owner QA compact microphone release verification
on:
  pull_request:
    paths:
      - 'p138/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p138-signed-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner RSA signature and six signed asset hashes
        run: node p138/tests/test-p138-signed-release.cjs
      - name: Functional narrator, compact controls and next ayah tests
        run: |
          node p138/tests/test-p138-natiq.cjs
          node p138/tests/test-p138-narrator-integration.cjs
          node p138/tests/test-p138-auto-next.cjs
          node p138/tests/test-p138-compact-voice-ui.cjs
