name: BASAIR P96.6 QA026 Native Ayah Retarget Safety (no publish)
on:
  push:
    branches:
      - fix/p96-qa026-native-single-retarget-20261108
    paths:
      - 'p92/owner-qa-001/p966-*'
      - 'p92/owner-qa-001/P966-*'
      - '.github/workflows/p96-qa026-retarget-once.yml'
  pull_request:
    paths:
      - 'p92/owner-qa-001/p966-*'
      - 'p92/owner-qa-001/P966-*'
      - '.github/workflows/p96-qa026-retarget-once.yml'
permissions:
  contents: read
jobs:
  native-single-retarget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check p92/owner-qa-001/p966-native-retarget-dedupe.js
          node --check p92/owner-qa-001/P966-QA026-RETARGET-TEST.mjs
      - name: Reproduce double native pointerup plus synthetic click; assert exactly once
        run: node p92/owner-qa-001/P966-QA026-RETARGET-TEST.mjs
      - name: Record candidate SHA256 without signing or publishing
        run: sha256sum p92/owner-qa-001/p966-native-retarget-dedupe.js p92/owner-qa-001/p966-native-retarget-dedupe.css
