name: Restore Basair Surah 51 manifest entry

on:
  push:
    paths:
      - '.github/workflows/restore-surah-051.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate, hash, merge, and publish Surah 51
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          MANIFEST=ROOT/'basair-tafsir-manifest.json'
          def compact(obj): return json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def h(b): return hashlib.sha256(b).hexdigest()
          def load_surah(num):
              d=ROOT/f'surah-{num:03d}'/'001'
              files=sorted(d.glob('part-*.json'))
              if not files: raise SystemExit(f'No files for surah {num}')
              ayahs=[]; raws=[]; parts=[]; expected=1; name=None
              for p in files:
                  b=p.read_bytes(); raws.append(b)
                  o=json.loads(b.decode('utf-8'))
                  if o['surah']!=num: raise SystemExit(f'Wrong surah in {p}')
                  if o['from']!=expected: raise SystemExit(f'Gap/order error in {p}: expected {expected}, got {o["from"]}')
                  if o['to']-o['from']+1!=o['ayah_count']: raise SystemExit(f'Count mismatch in {p}')
                  nums=[a['ayah'] for a in o['ayahs']]
                  if nums!=list(range(o['from'],o['to']+1)): raise SystemExit(f'Ayah sequence mismatch in {p}')
                  for a in o['ayahs']:
                      for k in ('ayah','meaning','bayan','tadabbur','summary'):
                          if k not in a: raise SystemExit(f'Missing {k} in {p} ayah {a.get("ayah")}')
                  name=name or o['name']; ayahs.extend(o['ayahs'])
                  parts.append({'from':o['from'],'to':o['to'],'file':p.as_posix(),'sha256':h(b),'bytes':len(b)})
                  expected=o['to']+1
              return name,ayahs,raws,parts
          manifest=json.loads(MANIFEST.read_text(encoding='utf-8'))
          # Infer canonical recipe from currently published Surah 57, preserving repository convention.
          n57,a57,r57,p57=load_surah(57)
          target=manifest['surahs']['57']['canonical_sha256']
          candidates={
            'ayahs_compact':lambda n,name,a,r,p:compact(a),
            'surah_ayahs_compact':lambda n,name,a,r,p:compact({'surah':n,'ayahs':a}),
            'canonical_object':lambda n,name,a,r,p:compact({'surah':n,'name':name,'content_version':'001','ayah_count':len(a),'ayahs':a}),
            'raw_concat':lambda n,name,a,r,p:b''.join(r),
            'raw_newline':lambda n,name,a,r,p:b'\n'.join(r),
            'part_hashes_concat':lambda n,name,a,r,p:''.join(x['sha256'] for x in p).encode(),
            'part_hashes_json':lambda n,name,a,r,p:compact([x['sha256'] for x in p]),
            'parts_meta_compact':lambda n,name,a,r,p:compact(p),
          }
          recipe=None
          for key,fn in candidates.items():
              if h(fn(57,n57,a57,r57,p57))==target:
                  recipe=key; break
          if recipe is None: raise SystemExit('Could not infer canonical hash recipe from Surah 57')
          name,ayahs,raws,parts=load_surah(51)
          if len(ayahs)!=60: raise SystemExit(f'Surah 51 expected 60 ayahs, found {len(ayahs)}')
          canonical=h(candidates[recipe](51,name,ayahs,raws,parts))
          manifest['surahs']['51']={'name':name,'content_version':'001','ayah_count':60,'parts':parts,'canonical_sha256':canonical}
          MANIFEST.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['51'],ensure_ascii=False))
          PY
          rm -f .github/workflows/restore-surah-051.yml
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Basair tafsir Surah 51 safely in current manifest'
          git push
