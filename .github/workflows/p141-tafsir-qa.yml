name: P141 Dual Root Tafsir Narrator QA (temporary)
on:
  pull_request:
    paths:
      - 'p141/**'
      - 'p121/owner-qa/modules/tafsir/p141-*.js'
      - 'p121/owner-qa/modules/tafsir/p141-*.css'
      - '.github/workflows/p141-tafsir-qa.yml'
permissions:
  contents: read
jobs:
  tafsir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: node --check p121/owner-qa/modules/tafsir/p141-natiq.js
      - name: Native voice recovery
        run: node p141/tests/test-p141-natiq.cjs
      - name: Original Quran recitation separation
        run: node p141/tests/test-p141-narrator-integration.cjs
      - name: Ayah continuation
        run: node p141/tests/test-p141-auto-next.cjs
      - name: Single waveform and Next preference
        run: node p141/tests/test-p141-wave-toggle.cjs
      - name: Sibling Tafsir roots, CSS and phonetic guide
        run: node p141/tests/test-p141-voice-recovery-and-lexicon.cjs
