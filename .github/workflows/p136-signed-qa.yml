name: P136 signed Tafsir owner QA pre-release verification
on:
  pull_request:
    paths:
      - 'p136/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p136-signed-qa.yml'
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner RSA, sequence 13, and six asset SHA256
        run: node p136/tests/test-p136-signed-release.cjs
      - name: Repeat reciter and pronunciation regression
        run: |
          node p136/tests/test-p136-reciter-bridge.cjs
          node p136/tests/test-p136-natiq.cjs
          node p136/tests/test-p136-narrator-integration.cjs
          node p136/tests/test-p136-migration-pronunciation.cjs
