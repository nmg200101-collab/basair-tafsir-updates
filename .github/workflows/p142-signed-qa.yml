name: P142 owner-signed Seq19 final release verification
on:
  pull_request:
    paths:
      - 'p142/**'
      - 'p121/owner-qa/release*.json'
      - '.github/workflows/p142-signed-qa.yml'
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner RSA signature and SHA256 for six OTA assets
        run: node p142/tests/test-p142-signed-release.cjs
      - name: Reverify original V695 narrator and selected Quran recitation
        run: |
          node p142/tests/test-p142-natiq.cjs
          node p142/tests/test-p142-narrator-integration.cjs
          node p142/tests/test-p142-auto-next.cjs
          node p142/tests/test-p142-wave-toggle-v695.cjs
          node p142/tests/test-p142-voice-recovery-and-lexicon.cjs
      - name: Chromium original V695 narrator visual acceptance
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files \
            --dump-dom "file://$PWD/p142/tests/p142-v695-native-layout.html" 2>/dev/null | grep -F '"pass":true'
