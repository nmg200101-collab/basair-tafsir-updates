name: Publish staged Surah 35

on:
  push:
    paths:
      - '.github/workflows/publish-surah-035.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main
      - name: Generate, validate, hash, and publish Surah 35
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          entries=[
          (1,'الحمد لله خالق السماوات والأرض على غير مثال سابق، جاعل الملائكة رسلًا ذوي أجنحة مثنى وثلاث ورباع، يزيد في الخلق ما يشاء، وهو على كل شيء قدير.','افتتحت السورة بحمد الله على الخلق والتدبير، وذكرت تفاوت خلق الملائكة وسعة القدرة.','تأمل تنوع الخلق ليزداد يقينك بأن قدرة الله لا يحدها مألوف البشر.','الحمد لله على الخلق وسعة القدرة.'),
          (2,'ما يفتح الله للناس من رحمة فلا يستطيع أحد أن يمسكها، وما يمسكه فلا يستطيع أحد أن يرسله من بعده، وهو العزيز الحكيم.','الرحمة والمنع بيد الله وحده، وكل ذلك واقع بعزة وحكمة.','لا تعلق قلبك بالمخلوق في فتح أو منع؛ فالخزائن بيد الله.','الفتح والمنع بيد الله.'),
          (3,'يا أيها الناس اذكروا نعمة الله عليكم، هل من خالق غير الله يرزقكم من السماء والأرض؟ لا إله إلا هو، فكيف تصرفون عن الحق؟','ذكرت الآية الناس بمنشأ النعمة والرزق لتقيم الحجة على التوحيد.','تذكر النعمة طريق عملي لتجديد التوحيد والشكر.','الخالق الرازق وحده مستحق العبادة.'),
          (4,'وإن يكذبوك فقد كذبت رسل من قبلك، وإلى الله ترجع الأمور كلها.','سلى الله رسوله بأن التكذيب سنة قديمة، وأن الفصل النهائي لله.','لا تجعل رفض الناس للحق سببًا لتركه؛ فالعاقبة والحكم لله.','التكذيب قديم والمرجع إلى الله.'),
          (5,'يا أيها الناس إن وعد الله حق، فلا تخدعنكم الحياة الدنيا، ولا يخدعنكم بالله الشيطان الغرور.','أكدت الآية حقيقة الوعد وحذرت من فتنة الدنيا ومن تزيين الشيطان.','زن قراراتك بوعد الله لا ببريق العاجل.','وعد الله حق والدنيا والشيطان فتنة.'),
          (6,'إن الشيطان لكم عدو فاتخذوه عدوًا، إنما يدعو أتباعه ليكونوا من أصحاب السعير.','بينت الآية حقيقة عداوة الشيطان وغايته من الدعوة إلى المعصية.','معرفة العدو لا تكفي؛ بل لا بد من مخالفة طريقه عمليًا.','الشيطان عدو يدعو إلى النار.'),
          (7,'الذين كفروا لهم عذاب شديد، والذين آمنوا وعملوا الصالحات لهم مغفرة وأجر كبير.','قابلت الآية بين مصير الكفر ومصير الإيمان المقرون بالعمل.','اجمع بين صحة الإيمان وصلاح العمل طلبًا للمغفرة والأجر.','عذاب للكافرين ومغفرة للمؤمنين.'),
          (8,'أفمن زين له سوء عمله فرآه حسنًا كمن عرف الحق؟ إن الله يضل من يشاء ويهدي من يشاء، فلا تذهب نفسك عليهم حسرات، إن الله عليم بما يصنعون.','من أخطر الضلال أن يرى الإنسان القبيح حسنًا، ونهى الله نبيه عن استهلاك النفس حزنًا على المعرضين.','راجع معاييرك دائمًا بالوحي حتى لا يتحول الخطأ في عينك إلى صواب.','خطر تزيين السوء ووجوب التسليم للهداية.'),
          (9,'والله الذي يرسل الرياح فتحرك السحاب، فيسوقه إلى بلد ميت فيحيي به الأرض بعد موتها؛ وكذلك يكون النشور.','جعل إحياء الأرض بالمطر دليلًا محسوسًا على البعث بعد الموت.','كل مشهد حياة بعد موت في الطبيعة يذكرك بإمكان البعث.','إحياء الأرض دليل على النشور.'),
          (10,'من كان يريد العزة فلله العزة جميعًا؛ إليه يصعد الكلام الطيب والعمل الصالح يرفعه، والذين يمكرون السيئات لهم عذاب شديد ومكرهم يبور.','مصدر العزة الحقيقي هو الله، وسبيل الرفعة قول طيب وعمل صالح، أما المكر السيئ فمصيره البطلان.','اطلب عزتك بالطاعة لا بالمكر أو التعلق بالقوة الزائفة.','العزة لله والطيب يرفع والمكر يبور.'),
          (11,'والله خلقكم من تراب ثم من نطفة ثم جعلكم أزواجًا، وما تحمل أنثى ولا تضع إلا بعلمه، وما يعمر من معمر ولا ينقص من عمره إلا في كتاب، إن ذلك على الله يسير.','جمعت الآية أطوار الخلق وإحاطة العلم بالأرحام والأعمار والآجال.','تذكر بدايتك وضعفك وإحاطة علم الله لتتواضع وتستعد لأجلك.','الخلق والأعمار كلها بعلم الله.'),
          (12,'وما يستوي البحران: هذا عذب سائغ شرابه، وهذا ملح شديد الملوحة، ومن كل تأكلون لحمًا طريًا وتستخرجون حلية تلبسونها، وترى السفن تشق الماء لتبتغوا من فضله ولعلكم تشكرون.','اختلاف المياه لم يمنع تنوع المنافع منها، وفي ذلك آية على الحكمة والتسخير.','انظر إلى اختلاف الموارد وكيف يسخرها الله لمصالح الإنسان ثم قابلها بالشكر.','اختلاف البحار وتنوع المنافع.'),
          (13,'يدخل الليل في النهار ويدخل النهار في الليل، وسخر الشمس والقمر كل يجري لأجل مسمى؛ ذلكم الله ربكم له الملك، والذين تدعون من دونه لا يملكون حتى القشرة الرقيقة على النواة.','انتظام الليل والنهار والأجرام دليل على الربوبية والملك، وبطلان ملك المعبودات من دون الله.','كل نظام كوني ثابت يعمق معنى أن الملك لله وحده.','الملك لله والمعبودات لا تملك شيئًا.'),
          (14,'إن تدعوهم لا يسمعوا دعاءكم، ولو سمعوا ما استجابوا لكم، ويوم القيامة يتبرؤون من إشراككم، ولا ينبئك مثل الخبير.','سلبت الآية عن المعبودات الباطلة السماع النافع والاستجابة، وذكرت تبرؤها يوم القيامة.','لا تجعل حاجتك بابًا لتعلق القلب بمن لا يملك لك نفعًا ولا ضرًا.','بطلان دعاء غير الله.'),
          (15,'يا أيها الناس أنتم المحتاجون إلى الله، والله هو الغني الحميد.','قررت الآية فقر الخلق الذاتي وغنى الله المطلق مع استحقاقه للحمد.','استشعار الفقر إلى الله يورث صدق الدعاء وترك الاستغناء الكاذب.','الخلق فقراء والله الغني الحميد.'),
          (16,'إن يشأ يذهبكم ويأت بخلق جديد.','الله غني عن الخلق، وقادر على إزالتهم والإتيان بغيرهم.','تواضع؛ فوجودك فضل لا حق واجب على الله.','الله قادر على استبدال الخلق.'),
          (17,'وما ذلك على الله بعزيز.','لا يعجز الله شيء من الإزالة أو الإيجاد.','لا تقيس قدرة الله على حدود قدرتك أنت.','لا شيء يعجز الله.'),
          (18,'ولا تحمل نفس إثم نفس أخرى، وإن تدع نفس مثقلة بالذنوب من يحمل عنها شيئًا لا يحمل منه شيء ولو كان قريبًا؛ إنما تنذر الذين يخشون ربهم بالغيب ويقيمون الصلاة، ومن تطهر من الذنوب فإنما يتطهر لنفسه، وإلى الله المصير.','أكدت الآية المسؤولية الفردية، وأن القرابة لا تحمل الذنب، وأن الانتفاع بالإنذار مرتبط بالخشية والصلاة والتزكي.','تحمل مسؤولية نفسك ولا تتكل على نسب أو قرب؛ فثمرة التزكية تعود عليك.','كل نفس مسؤولة عن عملها.'),
          (19,'وما يستوي الأعمى والبصير.','ضرب مثلًا لعدم استواء من فقد بصيرة الحق ومن أبصره.','اطلب بصيرة القلب كما تحرص على سلامة البصر.','لا يستوي الأعمى والبصير.'),
          (20,'ولا تستوي الظلمات ولا النور.','الضلال المتعدد لا يساوي نور الهداية.','الهداية نور يوضح الطريق؛ فلا تسو بين الحق والباطل.','الظلمات لا تساوي النور.'),
          (21,'ولا يستوي الظل ولا الحر الشديد.','استمر التمثيل بالفروق الواضحة لإبطال التسوية بين الإيمان والكفر.','الفروق الأخلاقية والعقدية الحقيقية لا تلغيها الأسماء أو المجاملات.','الظل لا يساوي الحرور.'),
          (22,'وما يستوي الأحياء ولا الأموات؛ إن الله يسمع من يشاء، وما أنت بمسمع من في القبور.','شبه أهل الإيمان بالأحياء وأهل الإعراض بالأموات من جهة الانتفاع، والهداية بيد الله.','احرص على حياة قلبك بالوحي قبل أن يعتاد الإعراض.','حياة القلوب بالإيمان.'),
          (23,'إن أنت إلا نذير.','وظيفة الرسول البلاغ والإنذار، وليس إجبار القلوب على الهداية.','أد واجب البيان دون ادعاء التحكم في نتائج القلوب.','وظيفة الرسول الإنذار.'),
          (24,'إنا أرسلناك بالحق بشيرًا ونذيرًا، وما من أمة إلا مضى فيها نذير.','رسالة النبي قائمة على الحق والبشارة والإنذار، وسنة الله إقامة الحجة على الأمم.','وازن في خطابك بين الرجاء والخوف كما يوازن الوحي.','الرسل بشارة وإنذار وإقامة حجة.'),
          (25,'وإن يكذبوك فقد كذب الذين من قبلهم؛ جاءتهم رسلهم بالبينات وبالكتب المكتوبة وبالكتاب المنير.','التكذيب لم يكن لنقص الدليل؛ فقد جاءت الأمم السابقة أنواع البينات والوحي.','كثرة الأدلة لا تنفع قلبًا اختار المكابرة.','التكذيب رغم وضوح البينات.'),
          (26,'ثم أخذت الذين كفروا، فكيف كان إنكاري عليهم وعقابي لهم.','عقب إقامة الحجة جاء الأخذ لمن أصر على الكفر.','لا تغتر بإمهال الله؛ فالإمهال ليس إهمالًا.','عاقبة المكذبين الأخذ والعقاب.'),
          (27,'ألم تر أن الله أنزل من السماء ماء فأخرجنا به ثمرات مختلفة ألوانها، ومن الجبال طرائق بيض وحمر مختلفة ألوانها وأخرى شديدة السواد.','لفتت الآية إلى تنوع ألوان الثمار والجبال بوصفه أثرًا من آثار القدرة والإبداع.','التنوع في الخلق باب للتفكر في وحدة الخالق وكمال صنعه.','تنوع الثمار والجبال آية.'),
          (28,'ومن الناس والدواب والأنعام كذلك مختلف ألوانه؛ إنما يخشى اللهَ من عباده العلماءُ، إن الله عزيز غفور.','العلم الحقيقي بآيات الله يثمر خشية، وتنوع الأحياء شاهد على القدرة.','اختبر قيمة علمك بما يحدثه في قلبك من خشية وعمل.','العلم الصادق يثمر خشية.'),
          (29,'إن الذين يتلون كتاب الله ويقيمون الصلاة وينفقون مما رزقناهم سرًا وعلانية يرجون تجارة لن تبور.','شبّهت الطاعات المستمرة بتجارة رابحة لا كساد فيها.','اجعل للقرآن والصلاة والإنفاق نصيبًا ثابتًا من يومك؛ فهي تجارة الآخرة.','طاعة الله تجارة لا تبور.'),
          (30,'ليوفيهم أجورهم ويزيدهم من فضله؛ إنه غفور شكور.','جزاء الطائعين ليس مجرد الوفاء، بل زيادة من فضل الله مع المغفرة والشكر لعباده.','اعمل وأحسن الظن بفضل الله الذي يزيد فوق الاستحقاق.','وفاء الأجر وزيادة الفضل.'),
          (31,'والذي أوحينا إليك من الكتاب هو الحق مصدقًا لما بين يديه؛ إن الله بعباده لخبير بصير.','القرآن حق يصدق أصول الوحي السابق، والله يعلم أحوال عباده.','ثقتك بالكتاب تنبع من مصدره العليم بأحوال البشر.','القرآن حق من الخبير البصير.'),
          (32,'ثم أورثنا الكتاب الذين اصطفينا من عبادنا؛ فمنهم ظالم لنفسه، ومنهم مقتصد، ومنهم سابق بالخيرات بإذن الله، ذلك هو الفضل الكبير.','بينت الآية تفاوت حملة الكتاب في الاستجابة: مقصر، ومتوسط، وسابق بالخيرات.','لا تكتف بالانتساب إلى الكتاب؛ نافس في مرتبة السبق بالخيرات.','حملة الكتاب درجات في العمل.'),
          (33,'جنات إقامة يدخلونها، يتحلون فيها بأساور من ذهب ولؤلؤ، ولباسهم فيها حرير.','وصفت الآية كرامة أهل الجنة وزينتهم ودوام إقامتهم.','تذكر نعيم الجنة ليهون عليك تعب الطاعة.','نعيم دائم وزينة لأهل الجنة.'),
          (34,'وقالوا الحمد لله الذي أذهب عنا الحزن؛ إن ربنا لغفور شكور.','أهل الجنة يحمدون الله على زوال كل حزن ويقرون بمغفرته وشكره.','اجعل الحمد عادة في الدنيا وأمل تمامه حيث لا حزن.','الحمد لله على زوال الحزن.'),
          (35,'الذي أنزلنا دار الإقامة من فضله، لا يمسنا فيها تعب ولا يمسنا فيها إعياء.','نسب أهل الجنة دخولهم إلى فضل الله، ووصفوا راحتها الكاملة.','لا تجعل الجنة ثمرة عملك وحده؛ بل اطلبها بفضل الله مع العمل.','دار إقامة بلا تعب.'),
          (36,'والذين كفروا لهم نار جهنم، لا يقضى عليهم فيموتوا ولا يخفف عنهم من عذابها؛ كذلك نجزي كل شديد الكفر.','بيّنت الآية دوام عذاب الكافرين وعدم حصول راحة بالموت أو التخفيف.','استعذ بالله من طريق يقود إلى عذاب لا انقطاع له.','عذاب الكافرين لا يخفف.'),
          (37,'وهم يصرخون فيها: ربنا أخرجنا نعمل صالحًا غير الذي كنا نعمل؛ أوَلم نعمركم زمنًا يتذكر فيه من أراد التذكر وجاءكم النذير؟ فذوقوا، فما للظالمين من نصير.','تأتي الحسرة بعد فوات زمن الاختيار، وقد قامت الحجة بالعمر والإنذار.','استثمر مهلة العمر الآن؛ فما بعد المعاينة ليس زمنًا للعمل.','حسرة بعد فوات زمن العمل.'),
          (38,'إن الله عالم غيب السماوات والأرض، وهو عليم بما تخفيه الصدور.','علم الله لا يقتصر على الظاهر بل يشمل الغيب والنيات.','نقِّ باطنك كما تعتني بظاهر عملك.','الله يعلم الغيب والصدور.'),
          (39,'هو الذي جعلكم خلفاء في الأرض، فمن كفر فعليه كفره، ولا يزيد الكافرين كفرهم عند ربهم إلا مقتًا، ولا يزيدهم إلا خسارًا.','الاستخلاف تكليف ومسؤولية، والكفر يرتد ضرره على صاحبه ويزيده مقتًا وخسارًا.','تعامل مع موقعك في الأرض كأمانة لا كامتياز بلا حساب.','الاستخلاف أمانة والكفر خسارة.'),
          (40,'قل أرأيتم شركاءكم الذين تدعون من دون الله؟ أروني ماذا خلقوا من الأرض، أم لهم شركة في السماوات، أم آتيناهم كتابًا فهم على حجة منه؟ بل لا يعد الظالمون بعضهم بعضًا إلا غرورًا.','ناقشت الآية الشرك بالحجة: لا خلق ولا شركة ولا وحي يثبت الاستحقاق، وإنما هو غرور متبادل.','اختبر المعتقدات بالدليل لا بتوارث الوعود والادعاءات.','الشرك بلا دليل من خلق أو وحي.'),
          (41,'إن الله يمسك السماوات والأرض أن تزولا، ولئن زالتا لا يمسكهما أحد من بعده؛ إنه كان حليمًا غفورًا.','قيام الكون واستمراره متعلق بإمساك الله وقدرته، ومع ذلك يحلم ويغفر لعباده.','ثبات العالم من حولك نعمة مستمرة تستحق الحمد والخضوع.','الله يمسك السماوات والأرض.'),
          (42,'وأقسموا بالله غاية أيمانهم لئن جاءهم نذير ليكونن أهدى من إحدى الأمم، فلما جاءهم نذير ما زادهم إلا نفورًا.','كشف مجيء النذير أن المشكلة لم تكن غياب الدليل بل رفضه بعد حضوره.','لا تجعل الوعود النظرية بالطاعة بديلًا عن الاستجابة حين يأتيك الحق.','ادعاء الهداية ثم النفور من النذير.'),
          (43,'استكبارًا في الأرض ومكرًا سيئًا، ولا يحيق المكر السيئ إلا بأهله؛ فهل ينتظرون إلا سنة الأولين؟ ولن تجد لسنة الله تبديلًا ولن تجد لها تحويلًا.','أصل النفور كان الاستكبار والمكر، وسنة الله أن يعود المكر على صاحبه وأن تجري العواقب بعدل ثابت.','احذر أن يدفعك الكبر إلى التحايل على الحق؛ فالمكر يرتد على صاحبه.','المكر السيئ يحيق بأهله.'),
          (44,'أولم يسيروا في الأرض فينظروا كيف كان عاقبة الذين من قبلهم وكانوا أشد منهم قوة؟ وما كان الله ليعجزه شيء في السماوات ولا في الأرض؛ إنه كان عليمًا قديرًا.','دعت الآية للاعتبار بالتاريخ؛ فقوة الأمم لم تمنع عنها سنة الله.','اقرأ مصائر السابقين لتصحح وهم الحصانة بالقوة.','قوة السابقين لم تعجز الله.'),
          (45,'ولو يؤاخذ الله الناس بما كسبوا ما ترك على ظهر الأرض من دابة، ولكنه يؤخرهم إلى أجل مسمى؛ فإذا جاء أجلهم فإن الله كان بعباده بصيرًا.','من حلم الله أنه لا يعاجل الناس بكل ذنوبهم، بل يمهلهم إلى أجل معلوم، ثم يحاسبهم بعلمه.','الإمهال فرصة للتوبة لا دليل رضا عن التقصير.','حلم الله يمهل إلى أجل معلوم.')
          ]
          def compact(o): return json.dumps(o,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def h(b): return hashlib.sha256(b).hexdigest()
          out=ROOT/'surah-035'/'001'; out.mkdir(parents=True,exist_ok=True)
          ayahs=[{'ayah':n,'meaning':m,'bayan':b,'tadabbur':t,'summary':s} for n,m,b,t,s in entries]
          part_ranges=[(1,25),(26,45)]
          parts=[]
          for a,z in part_ranges:
              obj={'schema':'basair-tafsir-part-v1','surah':35,'name':'فاطر','content_version':'001','from':a,'to':z,'ayah_count':z-a+1,'ayahs':ayahs[a-1:z]}
              raw=compact(obj)
              p=out/f'part-{a:03d}-{z:03d}.json'
              p.write_bytes(raw)
              parts.append({'from':a,'to':z,'file':p.as_posix(),'sha256':h(raw),'bytes':len(raw)})
          if [x['ayah'] for x in ayahs] != list(range(1,46)): raise SystemExit('Ayah sequence error')
          for x in ayahs:
              for k in ('ayah','meaning','bayan','tadabbur','summary'):
                  if k not in x or (k!='ayah' and not x[k].strip()): raise SystemExit(f'Missing {k} at {x.get("ayah")}')
          canonical=h(compact(ayahs))
          manifest_path=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['surahs']['35']={'name':'فاطر','content_version':'001','ayah_count':45,'parts':parts,'canonical_sha256':canonical}
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps(manifest['surahs']['35'],ensure_ascii=False))
