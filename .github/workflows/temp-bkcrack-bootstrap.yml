name: temp-bkcrack-bootstrap
on:
  push:
    paths:
      - .github/workflows/temp-bkcrack-bootstrap.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download bkcrack
        run: |
          set -eux
          curl -L --fail -o /tmp/bkcrack.tar.gz https://github.com/kimci86/bkcrack/releases/download/v1.8.1/bkcrack-1.8.1-Linux-x86_64.tar.gz
          mkdir -p /tmp/bk
          tar -xzf /tmp/bkcrack.tar.gz -C /tmp/bk
          find /tmp/bk -maxdepth 3 -type f -print
          BK="$(find /tmp/bk -type f -name bkcrack | head -1)"
          chmod +x "$BK"
          "$BK" --version
          cp "$BK" ./bkcrack
      - uses: actions/upload-artifact@v4
        with:
          name: temp-bkcrack-linux-x86_64
          path: bkcrack
