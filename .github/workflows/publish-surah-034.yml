name: Publish staged Surah 34

on:
  push:
    paths:
      - '.github/workflows/publish-surah-034.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate, validate, hash, and publish Surah 34
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          ROOT=pathlib.Path('.')
          entries=[
          (1,'الحمد لله الذي له ما في السماوات وما في الأرض وله الحمد في الآخرة وهو الحكيم الخبير.','افتتحت السورة بحمد الله وبيان ملكه المطلق وحكمته وخبرته.','استحضر أن كل نعمة وملك يرجع إلى الله في الدنيا والآخرة.','الحمد لله مالك كل شيء.'),
          (2,'يعلم ما يدخل في الأرض وما يخرج منها وما ينزل من السماء وما يعرج فيها، وهو الرحيم الغفور.','أحاط علم الله بحركات الكون كلها مع رحمته ومغفرته.','علم الله الشامل يدعوك إلى الصدق معه في السر والعلن.','علم شامل ورحمة ومغفرة.'),
          (3,'وقال الكافرون لا تأتينا الساعة، قل بلى وربي لتأتينكم، عالم الغيب لا يعزب عنه مثقال ذرة في السماوات ولا في الأرض ولا أصغر من ذلك ولا أكبر إلا في كتاب مبين.','ردت الآية إنكار الساعة بالقسم على وقوعها وبإحاطة علم الله بكل شيء.','اليقين بالبعث يغيّر طريقة النظر إلى العمل والحساب.','الساعة آتية وعلم الله محيط.'),
          (4,'ليجزي الذين آمنوا وعملوا الصالحات، أولئك لهم مغفرة ورزق كريم.','من حكمة البعث أن يثاب أهل الإيمان والعمل الصالح.','اجعل عملك للآخرة؛ فالمغفرة والرزق الكريم ثمرة الإيمان والعمل.','جزاء المؤمنين بالمغفرة والرزق.'),
          (5,'والذين سعوا في آياتنا معاجزين أولئك لهم عذاب من رجز أليم.','من حارب آيات الله وسعى لإبطالها فله عذاب مؤلم.','لا تجعل قوتك أو جدالك وسيلة لمقاومة الحق.','وعيد من يعاجز آيات الله.'),
          (6,'ويرى الذين أوتوا العلم أن الذي أنزل إليك من ربك هو الحق ويهدي إلى صراط العزيز الحميد.','أهل العلم الصادق يعرفون أن الوحي حق وهداية إلى طريق الله.','العلم النافع يقود إلى التصديق بالوحي لا إلى الكبر عنه.','العلم يشهد بصدق الوحي.'),
          (7,'وقال الذين كفروا هل ندلكم على رجل ينبئكم إذا مزقتم كل ممزق إنكم لفي خلق جديد.','تعجب الكافرون ساخرين من خبر البعث بعد تفرق الأجساد.','لا تجعل غرابة الأمر في الحس سببًا لرد قدرة الله.','سخرية الكافرين من البعث.'),
          (8,'أفترى على الله كذبًا أم به جنة؟ بل الذين لا يؤمنون بالآخرة في العذاب والضلال البعيد.','اتهموا الرسول بالكذب أو الجنون، والحقيقة أن إنكار الآخرة هو الضلال.','حين يعمى القلب قد يقلب الحق باطلًا والباطل حقًا.','الضلال في إنكار الآخرة.'),
          (9,'أفلم يروا إلى ما بين أيديهم وما خلفهم من السماء والأرض؟ إن نشأ نخسف بهم الأرض أو نسقط عليهم كسفًا من السماء، إن في ذلك لآية لكل عبد منيب.','دلهم الله على إحاطة قدرته بهم في السماء والأرض.','التأمل في الكون يورث الإنابة والخشية.','آيات القدرة لمن ينيب.'),
          (10,'ولقد آتينا داود منا فضلًا: يا جبال أوبي معه والطير، وألنا له الحديد.','من فضل الله على داود تسبيح الجبال والطير معه وتليين الحديد له.','المواهب نعمة حين تسخر للطاعة والعمران.','فضل الله على داود.'),
          (11,'أن اعمل سابغات وقدر في السرد، واعملوا صالحًا إني بما تعملون بصير.','أمر داود بصنع الدروع المحكمة وبالعمل الصالح مع مراقبة الله.','الإتقان المهني جزء من الأمانة إذا اقترن بالصلاح.','إتقان العمل مع الصلاح.'),
          (12,'ولسليمان الريح غدوها شهر ورواحها شهر، وأسلنا له عين القطر، ومن الجن من يعمل بين يديه بإذن ربه، ومن يزغ منهم عن أمرنا نذقه من عذاب السعير.','سخر الله لسليمان الريح والنحاس والجن ضمن أمره وحكمه.','القوة والتقنية نعم تحتاج ضبطًا بالعبودية والمسؤولية.','تسخير الريح والجن لسليمان.'),
          (13,'يعملون له ما يشاء من محاريب وتماثيل وجفان كالجواب وقدور راسيات؛ اعملوا آل داود شكرًا، وقليل من عبادي الشكور.','عددت الآية بعض الصناعات التي سخرها الله لسليمان، ثم أمرت بالشكر العملي.','الشكر ليس قولًا فقط؛ بل عمل يوافق نعمة الله.','الشكر العملي للنعم.'),
          (14,'فلما قضينا عليه الموت ما دلهم على موته إلا دابة الأرض تأكل منسأته، فلما خر تبينت الجن أن لو كانوا يعلمون الغيب ما لبثوا في العذاب المهين.','كشف موت سليمان أن الجن لا تعلم الغيب، إذ استمروا في العمل حتى سقط.','لا تنسب علم الغيب إلى مخلوق؛ فهو من خصائص الله.','الجن لا تعلم الغيب.'),
          (15,'لقد كان لسبإ في مسكنهم آية: جنتان عن يمين وشمال، كلوا من رزق ربكم واشكروا له، بلدة طيبة ورب غفور.','كانت سبأ في رخاء واسع وبيئة طيبة مع أمرهم بالشكر.','ازدهار المجتمعات يستحق شكر المنعم لا الغفلة عنه.','نعمة سبأ ووجوب الشكر.'),
          (16,'فأعرضوا فأرسلنا عليهم سيل العرم وبدلناهم بجنتيهم جنتين ذواتي أكل خمط وأثل وشيء من سدر قليل.','لما أعرضوا عن الشكر تحولت النعمة إلى خراب ونقص.','دوام النعم مرتبط بحسن استقبالها وشكرها.','زوال نعمة سبأ بالإعراض.'),
          (17,'ذلك جزيناهم بما كفروا، وهل نجازي إلا الكفور.','كان ما أصابهم جزاء على كفرهم وجحودهم.','الجحود المتكرر قد يحول النعمة إلى نقمة.','جزاء الكفور.'),
          (18,'وجعلنا بينهم وبين القرى التي باركنا فيها قرى ظاهرة وقدرنا فيها السير: سيروا فيها ليالي وأيامًا آمنين.','هيأ الله لهم طرقًا عامرة آمنة بين القرى.','الأمن وسهولة التنقل من النعم الحضارية الكبرى.','نعمة الأمن والعمران.'),
          (19,'فقالوا ربنا باعد بين أسفارنا وظلموا أنفسهم، فجعلناهم أحاديث ومزقناهم كل ممزق، إن في ذلك لآيات لكل صبار شكور.','بطروا النعمة وطلبوا ما يبدد راحتهم فمزقهم الله وصاروا عبرة.','البطر قد يجعل الإنسان يطلب ما يفسد النعمة التي بين يديه.','البطر سبب التفرق والهلاك.'),
          (20,'ولقد صدق عليهم إبليس ظنه فاتبعوه إلا فريقًا من المؤمنين.','اتبع أكثرهم خطوات الشيطان، ونجا المؤمنون.','الإيمان الواعي يحرر من اتباع الإغواء الجماعي.','اتباع إبليس إلا المؤمنين.'),
          (21,'وما كان له عليهم من سلطان إلا لنعلم من يؤمن بالآخرة ممن هو منها في شك، وربك على كل شيء حفيظ.','ليس للشيطان سلطان قهر، وإنما يظهر بالابتلاء من يثبت على الإيمان.','لا تلُم الشيطان وحده؛ فمسؤولية الاختيار قائمة.','وسوسة بلا سلطان قهري.'),
          (22,'قل ادعوا الذين زعمتم من دون الله؛ لا يملكون مثقال ذرة في السماوات ولا في الأرض، وما لهم فيهما من شرك وما له منهم من ظهير.','نفى الله عن المعبودات الباطلة الملك والشراكة والمعاونة.','التوحيد يقوم على سقوط كل دعوى للملك المستقل عن الله.','بطلان ملك الشركاء.'),
          (23,'ولا تنفع الشفاعة عنده إلا لمن أذن له، حتى إذا فزع عن قلوبهم قالوا ماذا قال ربكم؟ قالوا الحق وهو العلي الكبير.','الشفاعة كلها بإذن الله، والملائكة تعظم أمره وتقر بالحق.','لا تتعلق بوسيط استقلالًا عن إذن الله.','الشفاعة بإذن الله.'),
          (24,'قل من يرزقكم من السماوات والأرض؟ قل الله، وإنا أو إياكم لعلى هدى أو في ضلال مبين.','أقام الحجة بأن الله هو الرازق ثم دعا إلى نظر منصف في طريق الهدى والضلال.','المناظرة النافعة تبدأ من الحقائق المشتركة وتبتعد عن المكابرة.','الله هو الرازق.'),
          (25,'قل لا تسألون عما أجرمنا ولا نسأل عما تعملون.','كل إنسان مسؤول عن عمله أمام الله.','تحمل مسؤوليتك ولا تجعل حساب غيرك ذريعة لتبرير نفسك.','كل نفس مسؤولة عن عملها.'),
          (26,'قل يجمع بيننا ربنا ثم يفتح بيننا بالحق وهو الفتاح العليم.','سيجمع الله المختلفين ويحكم بينهم بالحق.','حين يشتد الخلاف تذكر أن الحكم النهائي لله.','الله يفصل بالحق.'),
          (27,'قل أروني الذين ألحقتم به شركاء، كلا بل هو الله العزيز الحكيم.','طالبهم بإظهار حقيقة شركائهم ثم أبطل الشرك وأثبت عزة الله وحكمته.','افحص المعتقدات بالبرهان لا بالموروث وحده.','إبطال الشرك وإثبات التوحيد.'),
          (28,'وما أرسلناك إلا كافة للناس بشيرًا ونذيرًا ولكن أكثر الناس لا يعلمون.','رسالة محمد عامة للناس تجمع البشارة والإنذار.','خطاب الدعوة المتوازن يجمع الرجاء والخوف.','عموم رسالة النبي.'),
          (29,'ويقولون متى هذا الوعد إن كنتم صادقين.','استعجل المكذبون موعد العذاب والبعث استهزاء.','تأخر الموعود لا يعني بطلانه.','استعجال المكذبين للوعد.'),
          (30,'قل لكم ميعاد يوم لا تستأخرون عنه ساعة ولا تستقدمون.','للوعيد والبعث وقت محدد لا يتقدم ولا يتأخر.','الأجل الدقيق يدعوك للاستعداد بدل التسويف.','ميعاد لا يتقدم ولا يتأخر.'),
          (31,'وقال الذين كفروا لن نؤمن بهذا القرآن ولا بالذي بين يديه، ولو ترى إذ الظالمون موقوفون عند ربهم يرجع بعضهم إلى بعض القول، يقول المستضعفون للذين استكبروا لولا أنتم لكنا مؤمنين.','يتبرأ الأتباع يوم القيامة من قادة الضلال ويلومونهم.','لا تجعل ضغط الجماعة يسلبك قرار الإيمان.','خصومة الأتباع والمتبوعين.'),
          (32,'قال الذين استكبروا للذين استضعفوا أنحن صددناكم عن الهدى بعد إذ جاءكم؟ بل كنتم مجرمين.','يرد المتكبرون بأن الأتباع اختاروا الإجرام بعد ظهور الهدى.','اتباع القادة لا يلغي مسؤولية الفرد.','المتبوعون يردون المسؤولية على الأتباع.'),
          (33,'وقال الذين استضعفوا للذين استكبروا بل مكر الليل والنهار إذ تأمروننا أن نكفر بالله ونجعل له أندادًا، وأسروا الندامة لما رأوا العذاب، وجعلنا الأغلال في أعناق الذين كفروا، هل يجزون إلا ما كانوا يعملون.','يكشف الأتباع ضغط المكر المتواصل، لكن الجميع يندمون ويجازون بأعمالهم.','انتبه للتأثير المتكرر الذي يطبع الباطل في النفس.','ندامة الفريقين وجزاء العمل.'),
          (34,'وما أرسلنا في قرية من نذير إلا قال مترفوها إنا بما أرسلتم به كافرون.','غالبًا ما يقاوم المترفون دعوة الإصلاح خشية فقد مصالحهم.','النعمة إذا لم تضبط بالتقوى قد تتحول إلى حاجز عن الحق.','المترفون يقاومون الرسل.'),
          (35,'وقالوا نحن أكثر أموالًا وأولادًا وما نحن بمعذبين.','احتجوا بكثرة المال والولد على رضا الله عنهم وأمنهم من العذاب.','لا تجعل الثراء معيارًا للرضا الإلهي.','المال ليس دليل النجاة.'),
          (36,'قل إن ربي يبسط الرزق لمن يشاء ويقدر ولكن أكثر الناس لا يعلمون.','سعة الرزق وضيقه تجريان بحكمة الله وليستا مقياسًا نهائيًا للكرامة.','اقرأ الرزق كابتلاء لا كحكم على قيمة الإنسان.','بسط الرزق وتقديره بيد الله.'),
          (37,'وما أموالكم ولا أولادكم بالتي تقربكم عندنا زلفى إلا من آمن وعمل صالحًا؛ فأولئك لهم جزاء الضعف بما عملوا وهم في الغرفات آمنون.','القرب من الله بالإيمان والعمل لا بالمال والولد، وللمؤمنين الجزاء المضاعف.','حوّل ما تملك إلى وسيلة للطاعة لا إلى مقياس للمنزلة.','القرب بالإيمان والعمل الصالح.'),
          (38,'والذين يسعون في آياتنا معاجزين أولئك في العذاب محضرون.','من يسعى لإبطال آيات الله يحضر للعذاب.','المواجهة المتعمدة للحق لها عاقبة.','وعيد معاجزي الآيات.'),
          (39,'قل إن ربي يبسط الرزق لمن يشاء من عباده ويقدر له، وما أنفقتم من شيء فهو يخلفه وهو خير الرازقين.','الله يوسع ويضيق، وما ينفق في وجوه الخير يخلفه الله بما يشاء.','الإنفاق الصادق لا يضيع عند الله.','الله يخلف النفقة.'),
          (40,'ويوم يحشرهم جميعًا ثم يقول للملائكة أهؤلاء إياكم كانوا يعبدون.','يسأل الله الملائكة توبيخًا للمشركين عن عبادتهم إياهم.','لا تنسب لمخلوق ما لا يرضاه لنفسه.','تبرئة الملائكة من عبادة المشركين.'),
          (41,'قالوا سبحانك أنت ولينا من دونهم، بل كانوا يعبدون الجن أكثرهم بهم مؤمنون.','تتبرأ الملائكة وتبين أن المشركين اتبعوا إغواء الجن.','قد يظن الإنسان أنه يتقرب للخير وهو في الحقيقة يتبع تضليلًا.','الملائكة تتبرأ من الشرك.'),
          (42,'فاليوم لا يملك بعضكم لبعض نفعًا ولا ضرًا، ونقول للذين ظلموا ذوقوا عذاب النار التي كنتم بها تكذبون.','يوم القيامة تسقط قدرة المعبودات الباطلة على النفع والضر.','لا تبن رجاءك على من لا يملك لك شيئًا يوم الحساب.','سقوط الشركاء ووقوع العذاب.'),
          (43,'وإذا تتلى عليهم آياتنا بينات قالوا ما هذا إلا رجل يريد أن يصدكم عما كان يعبد آباؤكم، وقالوا ما هذا إلا إفك مفترى، وقال الذين كفروا للحق لما جاءهم إن هذا إلا سحر مبين.','واجهوا الوحي بالتقليد والاتهام بدل البرهان.','التمسك بالموروث لا يصح إذا خالف الدليل.','اتهام الوحي واتباع الآباء.'),
          (44,'وما آتيناهم من كتب يدرسونها وما أرسلنا إليهم قبلك من نذير.','لم يكن لمشركي مكة كتاب سابق يبرر شركهم ولا رسول يؤيده.','لا تدّع الشرعية لما لا سند له من وحي أو برهان.','لا سند لشركهم.'),
          (45,'وكذب الذين من قبلهم وما بلغ هؤلاء معشار ما آتيناهم، فكذبوا رسلي فكيف كان نكير.','الأمم السابقة كانت أقوى وأغنى ومع ذلك لم تنج من عقوبة التكذيب.','القوة لا تحمي من سنن الله إذا فسد الطريق.','عبرة من الأمم المكذبة.'),
          (46,'قل إنما أعظكم بواحدة: أن تقوموا لله مثنى وفرادى ثم تتفكروا، ما بصاحبكم من جنة، إن هو إلا نذير لكم بين يدي عذاب شديد.','دعاهم إلى تفكير صادق بعيد عن ضغط الجماعة ليعرفوا صدق الرسول.','الخلوة الفكرية الصادقة قد تكسر أسر الضجيج الاجتماعي.','دعوة إلى التفكر المنصف.'),
          (47,'قل ما سألتكم من أجر فهو لكم، إن أجري إلا على الله وهو على كل شيء شهيد.','الرسول لا يطلب على دعوته أجرًا من الناس؛ أجره على الله.','الإخلاص يقوى حين لا يكون الحق وسيلة لمصلحة شخصية.','الدعوة بلا أجر دنيوي.'),
          (48,'قل إن ربي يقذف بالحق علام الغيوب.','الله يلقي الحق ويظهره بعلمه المحيط بالغيب.','ثق أن الحق له قوة من مصدره الإلهي.','الله يظهر الحق.'),
          (49,'قل جاء الحق وما يبدئ الباطل وما يعيد.','ظهر الحق واضمحل الباطل وعجز عن الإنشاء والإعادة.','لا تنخدع بضجيج الباطل؛ فمصيره الزوال.','مجيء الحق وزهوق الباطل.'),
          (50,'قل إن ضللت فإنما أضل على نفسي وإن اهتديت فبما يوحي إلي ربي، إنه سميع قريب.','الضلال ضرره على صاحبه، والهداية ثمرة الوحي من الله السميع القريب.','اربط هدايتك بالوحي لا بثقتك المجردة بنفسك.','الهداية بالوحي.'),
          (51,'ولو ترى إذ فزعوا فلا فوت وأخذوا من مكان قريب.','عند حلول العذاب يفزع المكذبون ولا يستطيعون الهرب.','ما دام باب العمل مفتوحًا فلا تؤخر التوبة.','لا مهرب عند وقوع العذاب.'),
          (52,'وقالوا آمنا به وأنى لهم التناوش من مكان بعيد.','يعلنون الإيمان بعد فوات وقت الاختيار فلا ينفعهم.','الإيمان النافع يكون قبل المعاينة والاضطرار.','إيمان بعد فوات الأوان.'),
          (53,'وقد كفروا به من قبل ويقذفون بالغيب من مكان بعيد.','كانوا يكذبون من قبل ويتكلمون في الغيب بلا علم.','لا تتحدث في الغيب بالظنون.','الكلام في الغيب بلا علم.'),
          (54,'وحيل بينهم وبين ما يشتهون كما فعل بأشياعهم من قبل، إنهم كانوا في شك مريب.','منعوا مما تمنوه بعد فوات الفرصة كما وقع لأمثالهم، وكان أصل ضلالهم الشك المريب.','عالج الشك بالعلم قبل أن يتحول إلى حرمان دائم.','الحيلولة بينهم وبين ما يشتهون.')]
          def compact(o): return json.dumps(o,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          def h(b): return hashlib.sha256(b).hexdigest()
          out=ROOT/'surah-034'/'001'; out.mkdir(parents=True,exist_ok=True)
          ayahs=[{'ayah':n,'meaning':m,'bayan':b,'tadabbur':t,'summary':s} for n,m,b,t,s in entries]
          part_ranges=[(1,25),(26,50),(51,54)]
          parts=[]; raws=[]
          for a,z in part_ranges:
              obj={'schema':'basair-tafsir-part-v1','surah':34,'name':'سبأ','content_version':'001','from':a,'to':z,'ayah_count':z-a+1,'ayahs':ayahs[a-1:z]}
              raw=compact(obj); p=out/f'part-{a:03d}-{z:03d}.json'; p.write_bytes(raw); raws.append(raw)
              parts.append({'from':a,'to':z,'file':p.as_posix(),'sha256':h(raw),'bytes':len(raw)})
          if [x['ayah'] for x in ayahs] != list(range(1,55)): raise SystemExit('Ayah sequence error')
          for x in ayahs:
              for k in ('ayah','meaning','bayan','tadabbur','summary'):
                  if k not in x or (k!='ayah' and not x[k].strip()): raise SystemExit(f'Missing {k} at {x.get("ayah")}')
          manifest_path=ROOT/'basair-tafsir-manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          def load_surah(num):
              d=ROOT/f'surah-{num:03d}'/'001'; files=sorted(d.glob('part-*.json')); aa=[]; rr=[]; pp=[]; expected=1; name=None
              for p in files:
                  raw=p.read_bytes(); o=json.loads(raw.decode());
                  if o['from']!=expected: raise SystemExit('Existing canonical reference has gap')
                  aa.extend(o['ayahs']); rr.append(raw); name=name or o['name']; expected=o['to']+1
                  pp.append({'from':o['from'],'to':o['to'],'file':p.as_posix(),'sha256':h(raw),'bytes':len(raw)})
              return name,aa,rr,pp
          ref=33 if '33' in manifest.get('surahs',{}) else 55
          rn,ra,rr,rp=load_surah(ref); target=manifest['surahs'][str(ref)]['canonical_sha256']
          candidates={
            'ayahs_compact':lambda n,name,a,r,p:compact(a),
            'surah_ayahs_compact':lambda n,name,a,r,p:compact({'surah':n,'ayahs':a}),
            'canonical_object':lambda n,name,a,r,p:compact({'surah':n,'name':name,'content_version':'001','ayah_count':len(a),'ayahs':a}),
            'raw_concat':lambda n,name,a,r,p:b''.join(r),
            'raw_newline':lambda n,name,a,r,p:b'\n'.join(r),
            'part_hashes_concat':lambda n,name,a,r,p:''.join(x['sha256'] for x in p).encode(),
            'part_hashes_json':lambda n,name,a,r,p:compact([x['sha256'] for x in p]),
            'parts_meta_compact':lambda n,name,a,r,p:compact(p)}
          recipe=next((k for k,f in candidates.items() if h(f(ref,rn,ra,rr,rp))==target),'ayahs_compact')
          canonical=h(candidates[recipe](34,'سبأ',ayahs,raws,parts))
          manifest['surahs']['34']={'name':'سبأ','content_version':'001','ayah_count':54,'parts':parts,'canonical_sha256':canonical}
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('canonical_recipe=',recipe)
          print(json.dumps(manifest['surahs']['34'],ensure_ascii=False))
          PY
          git config user.name 'basair-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add surah-034/001/*.json basair-tafsir-manifest.json
          git commit -m 'Publish Basair tafsir Surah Saba 34'
          git push
