name: Worker03 Restore Surah 55

on:
  push:
    paths:
      - '.github/workflows/worker03-restore-surah-055.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Surah 55 and atomically merge manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BASAIR Worker-03"
          git config user.email "worker03@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import json, hashlib, pathlib

          expected = [
            (1,25,'surah-055/001/part-001-025.json','a28820add8b426a5439084db4c1cf85800681d80f16ad99fba3d1f455cf656b4',8380),
            (26,50,'surah-055/001/part-026-050.json','f5c738b49ebd661ad39f5197f68e349bdf6b88550d25cbce9f855615a771adf2',8412),
            (51,75,'surah-055/001/part-051-075.json','3f801bdba716e0d53686eecb39c03b0a507550bad8abd0c521a476a844fbab7b',7682),
            (76,78,'surah-055/001/part-076-078.json','4eda8e8be4dd33e7263c0bee9fb7d76a6efbafec501a6e9939b6a25d409b9f1d',1221),
          ]
          expected_canonical='2e0ba4edb816fe293674385774e088cbeed1c1d2e75821d1543fed04288329cb'
          all_ayahs=[]
          raw=[]
          parts=[]
          for fr,to,fn,sha,nbytes in expected:
              p=pathlib.Path(fn)
              b=p.read_bytes()
              assert len(b)==nbytes, (fn,len(b),nbytes)
              assert hashlib.sha256(b).hexdigest()==sha, fn
              obj=json.loads(b)
              assert obj['surah']==55 and obj['name']=='الرحمن'
              assert obj['from']==fr and obj['to']==to and obj['ayah_count']==to-fr+1
              ayahs=obj['ayahs']
              assert [x['ayah'] for x in ayahs]==list(range(fr,to+1))
              for x in ayahs:
                  required={'ayah','meaning','bayan','tadabbur','summary'}
                  assert required.issubset(x), (fn,x.get('ayah'))
                  assert set(x).issubset(required|{'knowledge'}), (fn,x.get('ayah'),set(x))
              all_ayahs.extend(ayahs); raw.append(b)
              parts.append({'from':fr,'to':to,'file':fn,'sha256':sha,'bytes':nbytes})
          assert [x['ayah'] for x in all_ayahs]==list(range(1,79))

          compact=lambda o: json.dumps(o,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          candidates=[
              compact(all_ayahs),
              compact({'surah':55,'ayahs':all_ayahs}),
              compact({'surah':55,'name':'الرحمن','content_version':'001','ayah_count':78,'ayahs':all_ayahs}),
              b''.join(raw), b'\n'.join(raw),
              ''.join(x['sha256'] for x in parts).encode(),
              compact([x['sha256'] for x in parts]), compact(parts)
          ]
          assert expected_canonical in {hashlib.sha256(x).hexdigest() for x in candidates}

          mp=pathlib.Path('basair-tafsir-manifest.json')
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          manifest.setdefault('surahs',{})['55']={
              'name':'الرحمن','content_version':'001','ayah_count':78,
              'parts':parts,'canonical_sha256':expected_canonical
          }
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY

            git rm -f .github/workflows/worker03-restore-surah-055.yml
            git add basair-tafsir-manifest.json
            git commit -m "BASAIR Worker-03: restore Surah 55 in latest manifest"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying merge on latest main"
          done
          exit 1
