name: Basair - verify Way2Quran public directory (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: basair-way2quran-manual-verification
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-test URL validation and names
        run: python tests/test_way2quran_index.py
      - name: Install browser for public directory pagination
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Collect ONLY visible pages (not /api/)
        run: |
          python scripts/sync_way2quran.py --output p92/owner-qa-001/way2quran-readers.json \
            --max-pages 70 --min-records 1000
      - name: Commit verified directory only to this branch
        run: |
          git config user.name 'basair-directory-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p92/owner-qa-001/way2quran-readers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(basair): verify attributed Way2Quran directory'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
