name: p155-signed-source-gate
on:
  pull_request:
    paths:
      - 'p155/**'
      - 'p121/owner-qa/release.json'
      - 'p121/owner-qa/modules/tafsir/p155-*'
      - '.github/workflows/p155-signed-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p155-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native architecture and asset hashes
        run: node p155/tests/test-p155-source.cjs
      - name: RSA3072 signed Seq32 and rollback checks
        run: node p155/tests/test-p155-signed-release.cjs
