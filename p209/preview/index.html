<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>P209 V695 offline test</title>
<style>
html,body{margin:0;padding:0;background:#e5e2dc;font-family:system-ui;}
body{--stable-frame:#448b79;--mushaf-paper:#fbf8e8;--readerBrightness:1;--readerContrast:1}
#controlsLab{height:1px;overflow:hidden}#mushafReader{height:100vh;width:100%;background:#eee;overflow-y:auto}#pageReading{display:block}#mushafPage{position:relative;width:100%;margin:0 auto}.mushafText{width:100%}.localPageStage{position:relative;width:100%;aspect-ratio:720/1280;background:#fbf8e8}.localPageStage img{display:block;width:100%;height:100%;object-fit:fill}.stableMarginTint{position:absolute;inset:0;z-index:13;pointer-events:none;border:9px ridge #448b79;box-sizing:border-box} .stableFrame{position:absolute;inset:2px;z-index:14;pointer-events:none;border:4px double var(--stable-frame);border-radius:3px;box-shadow:inset 0 0 0 2px #448b7966}body.frameGold .stableFrame{border:7px double #ae7e24;box-shadow:inset 0 0 0 3px #ead39a}

</style></head><body class="reader-active frameGold" data-v144-print="tajwid"><div id="lab">Local P209 test — no production release</div>

<script>
window.__BASAIR_P209_FIELD_QA_ENABLED__=true;
window.nativeCalls={pause:0,stop:0};
window.__state={running:false,paused:false,scaleMode:'normal',surfaceBusy:false,page:4,progress:0,userScrolling:false};
window.__BASAIR_B345_SEQUENCE__={state:window.__state,stop:function(){window.nativeCalls.stop++;window.__state.running=false;document.body.removeAttribute('data-b345-sequence-surface');document.getElementById('b345NormalStack').hidden=true;document.getElementById('mushafText').style.display='block';}};

</script><script src="p209-one-visual-surface.js"></script></body></html>
