<g font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#395e54" text-anchor="middle" direction="rtl">
<text x="1115" y="484">السماوات والأرض</text><text x="1115" y="511">والليل والنهار</text>
<text x="880" y="484">نزول الماء</text><text x="880" y="511">وإحياء الأرض بعد موتها</text>
<text x="645" y="484">خلق الإنسان</text><text x="645" y="511">واختلاف الخلق</text>
<text x="410" y="484">النظر والتأمل</text><text x="410" y="511">باب المعرفة</text>
<text x="175" y="484">من الآيات إلى الإيمان</text><text x="175" y="511">بربوبية الله ووحدانيته</text>
</g>

<g fill="#2f7c67">
<path d="M1003 370h-30l12-11-7-8-28 25 28 25 7-8-12-11h30z"/>
<path d="M768 370h-30l12-11-7-8-28 25 28 25 7-8-12-11h30z"/>
<path d="M533 370h-30l12-11-7-8-28 25 28 25 7-8-12-11h30z"/>
<path d="M298 370h-30l12-11-7-8-28 25 28 25 7-8-12-11h30z"/>
</g>

<rect x="75" y="590" width="1130" height="74" rx="30" fill="#f4efe3" stroke="#d8c18c"/>
<text x="640" y="621" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" font-weight="700" fill="#174f42">في السماوات والأرض، وفي تعاقب الليل والنهار، وفي الأنفس وإحياء الأرض</text>
<text x="640" y="649" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#536f66">آياتٌ تدل على ربوبية الله ووحدانيته وتدعو إلى التفكر والمعرفة</text>
</svg>