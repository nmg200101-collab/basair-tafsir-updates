<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#f2ead8"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2ef"/><stop offset="1" stop-color="#f8e8c9"/></linearGradient>
  <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8198aa"/><stop offset="1" stop-color="#dce9e8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#163f34" flood-opacity=".10"/></filter>
</defs>
<rect width="1280" height="720" rx="34" fill="url(#bg)"/>
<rect x="18" y="18" width="1244" height="684" rx="30" fill="#fffdf9" stroke="#dcc79d" stroke-width="2"/>
<path d="M65 112h230M985 112h230" stroke="#b58a3f" stroke-width="2"/>
<circle cx="310" cy="112" r="7" fill="#b58a3f"/><circle cx="970" cy="112" r="7" fill="#b58a3f"/>
<text x="640" y="91" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="52" font-weight="700" fill="#155744">دلائل الربوبية في الخلق</text>
<rect x="385" y="114" width="510" height="50" rx="25" fill="#f5efe2" stroke="#dec89d"/>
<text x="640" y="147" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="600" fill="#245f50">من آيات الآفاق والأنفس إلى معرفة الرب</text>

<g filter="url(#shadow)">
<rect x="1010" y="198" width="210" height="355" rx="28" fill="#f7fbf7" stroke="#d5c395"/>
