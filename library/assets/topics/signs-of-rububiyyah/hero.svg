<rect x="70" y="198" width="210" height="355" rx="28" fill="#f7fbf7" stroke="#d5c395"/>
</g>

<g font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">
<circle cx="1115" cy="220" r="24" fill="#145b49"/><text x="1115" y="228" fill="#fff">١</text>
<circle cx="880" cy="220" r="24" fill="#145b49"/><text x="880" y="228" fill="#fff">٢</text>
<circle cx="645" cy="220" r="24" fill="#145b49"/><text x="645" y="228" fill="#fff">٣</text>
<circle cx="410" cy="220" r="24" fill="#145b49"/><text x="410" y="228" fill="#fff">٤</text>
<circle cx="175" cy="220" r="24" fill="#145b49"/><text x="175" y="228" fill="#fff">٥</text>
</g>

<g font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#174f42" text-anchor="middle" direction="rtl">
<text x="1115" y="270">نظام الكون</text>
<text x="880" y="270">المطر وإحياء الأرض</text>
<text x="645" y="270">آيات الأنفس</text>
<text x="410" y="270">التفكر في الآيات</text>
<text x="175" y="270">معرفة الرب</text>
</g>

<!-- 1 universe -->
<rect x="1035" y="304" width="160" height="138" rx="20" fill="#102a42"/>
<circle cx="1068" cy="392" r="26" fill="#f1bf60"/><g stroke="#f1bf60" stroke-width="3"><path d="M1068 354v-18"/><path d="M1068 430v18"/><path d="M1030 392h-18"/><path d="M1106 392h18"/></g>
