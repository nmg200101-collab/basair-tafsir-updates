<body><section id="tafsirReader" class="active"><div id="basairTafsirPrimaryTabs"></div>

<article class="v194T2Ayah" data-t2ayah="3" id="disabled">
<div class="v194T2Qrow">الرَّحْمَٰنِ الرَّحِيمِ</div><div class="v194T2Body">شرح الآية</div>
<button class="p144MicButton" aria-pressed="false"><b>الناطق</b></button>
<button class="b263r3NoteChip" data-r3-note-pos="1" hidden disabled><b>ملاحظة</b></button>

</article></div></section>
<pre id="qa">PENDING</pre>
<script>window.__BASAIR_TAFSIR_STEP2__={state:()=>({s:1,a:2}),open:()=>{}};</script>
<script src="../../p121/owner-qa/modules/tafsir/p150-reader-polish.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>{
 setTimeout(()=>{
 try{
 const api=window.__BASAIR_TAFSIR_P150__;api.refresh();
 const first=document.getElementById('missing'),second=document.getElementById('disabled');
 const bar=first.querySelector('.basairB231AyahActions'),bar2=second.querySelector('.basairB231AyahActions');
 const slot=bar.querySelector('.p149NoteSlot'),slot2=bar2.querySelector('.p149NoteSlot');
 const provisional=slot.querySelector('button[data-p150-provisional-note="1"]');
 const native=second.querySelector('button.b263r3NoteChip');
 const before=!!provisional&&!provisional.disabled&&!provisional.hidden&&native.parentElement===slot2&&!native.disabled&&!native.hidden;
 const columns=getComputedStyle(bar).gridTemplateColumns.trim().split(/\s+/);
 const fifthVisible=columns.length===5&&
   provisional.getBoundingClientRect().width>=38&&provisional.getBoundingClientRect().height>=44&&
   provisional.getBoundingClientRect().left>=bar.getBoundingClientRect().left-2;
 const off=getComputedStyle(first.querySelector('.p144MicButton'),'::after').content.includes('متوقف');
 const late=document.createElement('button');late.className='b263r3NoteChip';late.dataset.r3NotePos='1';late.innerHTML='<b>ملاحظة</b>';first.appendChild(late);
 api.refresh();
 const replaced=late.parentElement===slot&&!slot.querySelector('[data-p150-provisional-note]');
 const result={pass:before&&fifthVisible&&off&&replaced,before,fifthVisible,off,replaced,columns:columns.length};
 document.getElementById('qa').textContent=JSON.stringify(result);
 }catch(e){document.getElementById('qa').textContent='ERROR '+e.stack}
 },160);
});</script></body></html>
